---
# =============================================================================
# LINUXMUSTER.NET 7.4 INSTALLATION PLAYBOOK (Ubuntu 26.04)
# =============================================================================
#
# Usage:
#   ansible-playbook linuxmuster.yml -e lmn_schoolname="Meine Schule" -e lmn_adminpw="..."
#
#   Or via the API with extra_vars:
#   POST /api/playbook/start
#   {
#     "variables": {
#       "extra_vars": {
#         "lmn_schoolname": "Meine Schule",
#         "lmn_adminpw": "MeinPasswort1!"
#       }
#     }
#   }
#
# =============================================================================

- name: linuxmuster.net 7.4 installation
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  # So that the paused automatic updates are switched back on after a failed task as well.
  force_handlers: true

  # Pass the system proxy (if set) to all tasks so that get_url/curl/apt also
  # work behind a proxy. The values are read early from /etc/environment
  # (empty = no proxy).
  environment:
    http_proxy: "{{ lmn_http_proxy | default('') }}"
    https_proxy: "{{ lmn_https_proxy | default('') }}"
    HTTP_PROXY: "{{ lmn_http_proxy | default('') }}"
    HTTPS_PROXY: "{{ lmn_https_proxy | default('') }}"
    no_proxy: "{{ lmn_no_proxy | default('') }}"
    NO_PROXY: "{{ lmn_no_proxy | default('') }}"

  # Variables can be overridden by:
  # 1. -e / --extra-vars on the command line
  # 2. API extra_vars (only the settings in ALLOWED_EXTRA_VARS, api/models.py)

  vars:
    # -------------------------------------------------------------------------
    # DEFAULTS (overridden by extra_vars)
    # -------------------------------------------------------------------------
    # Extra vars passed with -e or through the API override these values.

    # Network
    lmn_server_ip: '10.0.0.1'
    lmn_netmask: '255.255.0.0'
    lmn_gateway: '10.0.0.254'

    # DNS forwarder for the Samba internal DNS.
    # linuxmuster-setup always writes "dns forwarder = <firewallip>" into
    # smb.conf. Without an installed firewall that points nowhere. 'auto' reads
    # the upstream DNS the host actually uses (from /run/systemd/resolve/resolv.conf
    # or resolv.conf) and uses it; only if none is found, it falls back to 9.9.9.9.
    # Set a fixed one with -e lmn_dns_forwarder=<ip>.
    lmn_dns_forwarder: 'auto'

    # Server
    lmn_servername: 'server'
    lmn_domainname: 'linuxmuster.lan'

    # School
    lmn_schoolname: 'Meine Schule'
    lmn_location: 'Musterstadt'
    lmn_country: 'de'
    lmn_state: 'BW'

    # DHCP
    lmn_dhcprange: '10.0.100.1 10.0.100.254'

    # Admin password (MUST be overridden!)
    lmn_adminpw: 'Muster!'

    # System
    lmn_timezone: 'Europe/Berlin'
    lmn_locale: 'de_DE.UTF-8'

    # Advanced options
    lmn_skip_firewall: true
    lmn_unattended: true
    # Pauses automatic updates only during the installation; security updates run again afterwards.
    lmn_disable_auto_updates: true

    # Local installation (edulution UI and LMN server on the same machine).
    # Set to true for "same machine" in the installer UI.
    # In that case the Ajenti web UI (port 443) collides with the edulution
    # Traefik, so Ajenti is moved to lmn_webui_port.
    lmn_local_install: false
    lmn_webui_port: 8443

    # The firewall is NOT installed by default (lmn_skip_firewall: true).
    # It has to be set up separately.

    # Repository (normally left unchanged)
    lmn_repo_url: 'https://deb.linuxmuster.net/'
    lmn_repo_gpg_url: 'https://deb.linuxmuster.net/pub.gpg'
    # Fingerprint of the linuxmuster.net archive key; lmn-appliance gets this key as well.
    lmn_repo_key_fingerprint: '21A91AEC28D1BE943FCF2AA94E8B8B667D752C32'  # gitleaks:allow
    lmn_repo_key_download: /root/linuxmuster.gpg
    lmn_repo_keyring: /usr/share/keyrings/linuxmuster.net.gpg
    lmn_appliance_global_key: /etc/apt/trusted.gpg.d/linuxmuster.net.gpg
    lmn_repo_list: /etc/apt/sources.list.d/lmn.list
    lmn_repo_sources: /etc/apt/sources.list.d/lmn.sources
    lmn_appliance_script: /root/lmn-appliance
    lmn_repo_key_fpr: "{{ lmn_repo_key_fingerprint | replace(' ', '') | upper }}"
    lmn_repo_deb_line: 'deb [arch=amd64 signed-by={{ lmn_repo_keyring }}] {{ lmn_repo_url }} {{ lmn_repo_distribution }} main'
    # Lines in lmn-appliance that are switched to the checked key.
    lmn_appliance_key_lines:
      lmnkey_remote: "lmnkey_remote = 'file://{{ lmn_repo_key_download }}'"
      lmnkey_local: "lmnkey_local = '{{ lmn_repo_keyring }}'"
    # linuxmuster version by Ubuntu version; new installations use 7.4 on Ubuntu 26.04 only.
    # lmn_repo_distribution/lmn_prepare_version are derived from it with set_fact
    # (can be overridden with -e; another lmn-appliance version also needs
    # lmn_prepare_commit and lmn_appliance_sha256).
    # lmn-appliance is downloaded at the tag's commit and checked against the checksum;
    # a new tag needs both values updated.
    lmn_version_map:
      '26':
        distribution: 'lmn74'
        prepare_version: 'v7.4.0'
        prepare_commit: '659a9940c03efc5e0a4d6d4a096a9096f06d9a8c'
        appliance_sha256: 'd08354cb5114070f9e6b2407821fd8903a296f779dba00dd573b9dc6ae3a7351'
        label: '7.4'
    lmn_appliance_url: 'https://raw.githubusercontent.com/linuxmuster/linuxmuster-prepare/{{ lmn_prepare_commit }}/lmn-appliance'

    # Packages
    lmn_additional_packages:
      - net-tools
      - iputils-ping
      - dnsutils
      - qemu-guest-agent
      - apt-utils
      - locales
      - wget
      - curl
      - gnupg
      - lvm2
      # Marked as manually installed so that a later autoremove does not take the package with it.
      - unattended-upgrades

  tasks:
    # =========================================================================
    # BASIC SYSTEM CONFIGURATION
    # =========================================================================

    - name: Check the operating system (Ubuntu 26.04 -> linuxmuster.net 7.4)
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version in lmn_version_map
        fail_msg: >-
          linuxmuster.net 7.4 requires Ubuntu 26.04, found: {{ ansible_distribution }}
          {{ ansible_distribution_version }}. Please run a release upgrade to Ubuntu 26.04
          first (do-release-upgrade) and then start the installation again.
        success_msg: 'Ubuntu {{ ansible_distribution_version }} detected'

    # setup.ini takes one value per line; a line break would add another setting.
    - name: Check the settings
      ansible.builtin.assert:
        that:
          - lmn_adminpw | string | trim | length > 0
          - lmn_adminpw != 'Muster!'
          - >-
            (lmn_server_ip ~ lmn_netmask ~ lmn_gateway ~ lmn_servername ~ lmn_domainname
            ~ lmn_dhcprange ~ lmn_schoolname ~ lmn_location ~ lmn_country ~ lmn_state ~ lmn_adminpw)
            is not search('[\r\n]')
        fail_msg: >-
          Please set your own admin password (-e lmn_adminpw=...). The values for
          setup.ini must not contain a line break.

    - name: Determine the linuxmuster version from the Ubuntu version
      ansible.builtin.set_fact:
        lmn_repo_distribution: "{{ lmn_version_map[ansible_distribution_major_version].distribution }}"
        lmn_prepare_version: "{{ lmn_version_map[ansible_distribution_major_version].prepare_version }}"
        lmn_prepare_commit: "{{ lmn_version_map[ansible_distribution_major_version].prepare_commit }}"
        lmn_appliance_sha256: "{{ lmn_version_map[ansible_distribution_major_version].appliance_sha256 }}"
        lmn_version_label: "{{ lmn_version_map[ansible_distribution_major_version].label }}"

    # Values set with -e take precedence over set_fact; another version needs its own commit and checksum.
    - name: Check the lmn-appliance version and commit
      ansible.builtin.assert:
        that:
          - >-
            (lmn_prepare_version == lmn_defaults.prepare_version and lmn_prepare_commit == lmn_defaults.prepare_commit
            and lmn_appliance_sha256 == lmn_defaults.appliance_sha256)
            or (lmn_prepare_commit != lmn_defaults.prepare_commit and lmn_appliance_sha256 != lmn_defaults.appliance_sha256)
        fail_msg: >-
          For lmn-appliance {{ lmn_prepare_version }}, please also set lmn_prepare_commit and
          lmn_appliance_sha256 (-e).
      vars:
        lmn_defaults: '{{ lmn_version_map[ansible_distribution_major_version] }}'

    - name: Show the selected linuxmuster version
      ansible.builtin.debug:
        msg: >-
          Ubuntu {{ ansible_distribution_version }} detected -> linuxmuster.net
          {{ lmn_version_label }} ({{ lmn_repo_distribution }}, lmn-appliance
          {{ lmn_prepare_version }}, commit {{ lmn_prepare_commit[:7] }})

    # -------------------------------------------------------------------------
    # DETECT PROXY + UPSTREAM DNS (before the network is reconfigured)
    # -------------------------------------------------------------------------
    - name: Read the system proxy from /etc/environment
      ansible.builtin.shell: |
        . /etc/environment 2>/dev/null || true
        printf '%s\n%s\n%s\n' "${http_proxy:-${HTTP_PROXY:-}}" "${https_proxy:-${HTTPS_PROXY:-}}" "${no_proxy:-${NO_PROXY:-}}"
      args:
        executable: /bin/bash
      register: lmn_proxy_raw
      changed_when: false
      failed_when: false

    - name: Set the proxy variables
      ansible.builtin.set_fact:
        lmn_http_proxy: "{{ lmn_proxy_raw.stdout_lines[0] | default('') }}"
        lmn_https_proxy: "{{ lmn_proxy_raw.stdout_lines[1] | default('') }}"
        lmn_no_proxy: "{{ lmn_proxy_raw.stdout_lines[2] | default('') }}"

    - name: Show the proxy configuration
      ansible.builtin.debug:
        msg: >-
          Proxy: http='{{ lmn_http_proxy }}' https='{{ lmn_https_proxy }}'
          no_proxy='{{ lmn_no_proxy }}'

    - name: Detect the upstream DNS of the host
      ansible.builtin.shell: |
        for f in /run/systemd/resolve/resolv.conf /etc/resolv.conf; do
          [ -r "$f" ] || continue
          ns=$(awk '/^[[:space:]]*nameserver/ {print $2}' "$f" | grep -vE '^(127\.|::1|fe80)' | head -1)
          [ -n "$ns" ] && { echo "$ns"; exit 0; }
        done
        command -v resolvectl >/dev/null 2>&1 && resolvectl dns 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | grep -vE '^127\.' | head -1
      args:
        executable: /bin/bash
      register: lmn_detected_dns
      changed_when: false
      failed_when: false

    - name: Determine the DNS forwarder (auto -> detected upstream, otherwise 9.9.9.9)
      ansible.builtin.set_fact:
        lmn_dns_forwarder: "{{ (lmn_detected_dns.stdout | default('') | trim) or '9.9.9.9' }}"
      when: lmn_dns_forwarder == 'auto'

    - name: Show the DNS forwarder in use
      ansible.builtin.debug:
        msg: "DNS forwarder for Samba: {{ lmn_dns_forwarder }}"

    - name: Wait for the apt lock
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

    - name: Stop and disable unattended-upgrades
      ansible.builtin.shell: |
        systemctl stop unattended-upgrades 2>/dev/null || true
        systemctl disable unattended-upgrades 2>/dev/null || true
        killall -9 unattended-upgr 2>/dev/null || true
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          sleep 3
        done
      changed_when: true
      when: lmn_disable_auto_updates | bool
      notify: Switch automatic security updates back on

    - name: Configure the time zone
      community.general.timezone:
        name: '{{ lmn_timezone }}'

    - name: Disable cloud-init
      ansible.builtin.file:
        path: /etc/cloud/cloud-init.disabled
        state: touch
        mode: '0644'
      ignore_errors: true

    - name: Wait for the apt lock (before cloud-init)
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

    - name: Remove the cloud-init package
      ansible.builtin.apt:
        name: cloud-init
        state: absent
        purge: true
      ignore_errors: true

    - name: Remove the cloud-init directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/cloud
        - /var/lib/cloud
      ignore_errors: true

    - name: Install the required packages
      ansible.builtin.apt:
        name: '{{ lmn_additional_packages }}'
        state: present
        update_cache: true

    - name: Generate the locale
      community.general.locale_gen:
        name: '{{ lmn_locale }}'
        state: present

    - name: Set the locale as default
      ansible.builtin.command:
        argv: [localectl, set-locale, "LANG={{ lmn_locale }}"]
      changed_when: true

    # =========================================================================
    # PAUSE AUTOMATIC UPDATES DURING THE INSTALLATION
    # =========================================================================

    - name: Pause automatic updates during the installation
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: '^APT::Periodic::Unattended-Upgrade'
        line: 'APT::Periodic::Unattended-Upgrade "0";'
        create: true
        mode: '0644'
      when: lmn_disable_auto_updates | bool
      notify: Switch automatic security updates back on

    # =========================================================================
    # QEMU GUEST AGENT (for virtualisation)
    # =========================================================================

    - name: Enable the QEMU guest agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started
      ignore_errors: true

    # =========================================================================
    # SERIAL CONSOLE (for Proxmox)
    # =========================================================================

    - name: Enable the serial console service
      ansible.builtin.systemd:
        name: serial-getty@ttyS0.service
        enabled: true
        state: started
      ignore_errors: true

    # =========================================================================
    # SYSTEM UPDATE
    # =========================================================================

    - name: Update the system
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

    # =========================================================================
    # LINUXMUSTER.NET REPOSITORY
    # =========================================================================

    - name: Download the GPG key
      ansible.builtin.get_url:
        url: '{{ lmn_repo_gpg_url }}'
        dest: '{{ lmn_repo_key_download }}'
        mode: '0644'
        force: true

    - name: Read the fingerprint of the linuxmuster key
      ansible.builtin.command:
        argv: [gpg, --batch, --show-keys, --with-colons, '{{ lmn_repo_key_download }}']
      register: lmn_repo_key_info
      changed_when: false

    - name: Check the fingerprint of the linuxmuster key
      ansible.builtin.assert:
        that:
          - lmn_repo_key_info.stdout_lines | select('match', '^pub:') | list | length == 1
          - (lmn_repo_key_info.stdout_lines | select('match', '^fpr:') | first).split(':')[9] == lmn_repo_key_fpr
        fail_msg: >-
          {{ lmn_repo_gpg_url }} does not provide the expected key
          ({{ lmn_repo_key_fingerprint }}). Installation stopped.
        quiet: true

    - name: Convert and install the GPG key
      ansible.builtin.command:
        argv: [gpg, --batch, --yes, --dearmor, -o, '{{ lmn_repo_keyring }}', '{{ lmn_repo_key_download }}']

    # Fixed content instead of apt_repository: an older setup leaves lmn.list
    # without signed-by, which would otherwise stay next to the new line.
    - name: Remove the globally trusted linuxmuster key before adding the repository
      ansible.builtin.file:
        path: '{{ lmn_appliance_global_key }}'
        state: absent

    - name: Find an existing deb822 source before adding the repository
      ansible.builtin.stat:
        path: '{{ lmn_repo_sources }}'
      register: lmn_repo_sources_before

    - name: Add the linuxmuster repository
      ansible.builtin.copy:
        dest: '{{ lmn_repo_list }}'
        content: "{{ lmn_repo_deb_line }}\n"
        mode: '0644'
      when: not lmn_repo_sources_before.stat.exists

    - name: Remove the duplicate linuxmuster source before lmn-appliance
      ansible.builtin.file:
        path: '{{ lmn_repo_list }}'
        state: absent
      when: lmn_repo_sources_before.stat.exists

    - name: Update the package lists
      ansible.builtin.apt:
        update_cache: true

    # =========================================================================
    # LMN-APPLIANCE SCRIPT
    # =========================================================================

    - name: Download the lmn-appliance script
      ansible.builtin.get_url:
        url: '{{ lmn_appliance_url }}'
        dest: '{{ lmn_appliance_script }}'
        mode: '0755'
        checksum: 'sha256:{{ lmn_appliance_sha256 }}'

    # lmn-appliance gets the key checked above as its source and keyring.
    - name: Switch lmn-appliance to the checked key
      ansible.builtin.replace:
        path: '{{ lmn_appliance_script }}'
        regexp: '^{{ item.key }} = .*$'
        replace: '{{ item.value }}'
      loop: '{{ lmn_appliance_key_lines | dict2items }}'
      loop_control:
        label: '{{ item.value }}'

    - name: Read the lmn-appliance script
      ansible.builtin.slurp:
        src: '{{ lmn_appliance_script }}'
      register: lmn_appliance_source

    - name: Check that lmn-appliance uses the checked key
      ansible.builtin.assert:
        that:
          - (lmn_appliance_lines | select('match', '^lmnkey_remote ') | list) == [lmn_appliance_key_lines.lmnkey_remote]
          - (lmn_appliance_lines | select('match', '^lmnkey_local ') | list) == [lmn_appliance_key_lines.lmnkey_local]
        fail_msg: >-
          lmn-appliance cannot be switched to the checked key
          (lmnkey_remote or lmnkey_local). Installation stopped.
        quiet: true
      vars:
        lmn_appliance_lines: "{{ (lmn_appliance_source.content | b64decode).splitlines() }}"

    - name: Convert the netmask to CIDR notation
      ansible.builtin.set_fact:
        lmn_cidr: "{{ (lmn_server_ip + '/' + lmn_netmask) | ansible.utils.ipaddr('prefix') }}"

    - name: Run lmn-appliance (server profile)
      ansible.builtin.shell: |
        set -o pipefail
        {{ lmn_appliance_script }} -p server -u \
          -n {{ (lmn_server_ip ~ '/' ~ lmn_cidr) | quote }} \
          -f {{ lmn_gateway | quote }} \
          -d {{ lmn_domainname | quote }} \
          -t {{ lmn_servername | quote }} \
          2>&1 | while IFS= read -r line; do
          echo "$line"
        done
      args:
        executable: /bin/bash
        creates: /etc/linuxmuster/.appliance_configured
      register: lmn_appliance_result
      changed_when: lmn_appliance_result.rc == 0
      async: 1800
      poll: 30

    # =========================================================================
    # REPOSITORY KEY AFTER LMN-APPLIANCE
    # =========================================================================
    # Follow-up check: lmn-appliance may leave only the checked key behind,
    # and the repository uses it through signed-by only.

    - name: Check the repository key after lmn-appliance
      block:
        - name: Find the keys written by lmn-appliance
          ansible.builtin.stat:
            path: '{{ item }}'
          loop:
            - '{{ lmn_repo_keyring }}'
            - '{{ lmn_appliance_global_key }}'
          register: lmn_written_keys

        - name: Repository key present after lmn-appliance
          ansible.builtin.assert:
            that: lmn_written_keys.results[0].stat.exists
            fail_msg: '{{ lmn_repo_keyring }} is missing after lmn-appliance.'
            quiet: true

        - name: Read the fingerprint of the keys written by lmn-appliance
          ansible.builtin.command:
            argv: [gpg, --batch, --show-keys, --with-colons, '{{ item.stat.path }}']
          loop: "{{ lmn_written_keys.results | selectattr('stat.exists') | list }}"
          loop_control:
            label: '{{ item.stat.path }}'
          register: lmn_written_key_info
          changed_when: false

        - name: Check the fingerprint of the keys written by lmn-appliance
          ansible.builtin.assert:
            that:
              - item.stdout_lines | select('match', '^pub:') | list | length == 1
              - (item.stdout_lines | select('match', '^fpr:') | first).split(':')[9] == lmn_repo_key_fpr
            fail_msg: >-
              {{ item.item.stat.path }} does not contain the expected key
              ({{ lmn_repo_key_fingerprint }}). Installation stopped.
            quiet: true
          loop: '{{ lmn_written_key_info.results }}'
          loop_control:
            label: '{{ item.item.stat.path }}'
      rescue:
        - name: Remove the unexpected linuxmuster key and its package sources
          ansible.builtin.file:
            path: '{{ item }}'
            state: absent
          loop:
            - '{{ lmn_repo_keyring }}'
            - '{{ lmn_appliance_global_key }}'
            - '{{ lmn_repo_list }}'
            - '{{ lmn_repo_sources }}'

        - name: 'Stop: unexpected linuxmuster key'
          ansible.builtin.fail:
            msg: >-
              After lmn-appliance the linuxmuster key is missing or a different one is present;
              the key and the package source were removed. Expected: {{ lmn_repo_key_fingerprint }}

    - name: Remove the globally trusted linuxmuster key
      ansible.builtin.file:
        path: '{{ lmn_appliance_global_key }}'
        state: absent

    - name: Find the deb822 source written by lmn-appliance
      ansible.builtin.stat:
        path: '{{ lmn_repo_sources }}'
      register: lmn_repo_sources_file

    - name: Restrict the linuxmuster repository to its key
      ansible.builtin.copy:
        dest: '{{ lmn_repo_list }}'
        content: "{{ lmn_repo_deb_line }}\n"
        mode: '0644'
      when: not lmn_repo_sources_file.stat.exists

    - name: Remove the duplicate linuxmuster source
      ansible.builtin.file:
        path: '{{ lmn_repo_list }}'
        state: absent
      when: lmn_repo_sources_file.stat.exists

    # =========================================================================
    # MAKE SURE THE LINUXMUSTER SERVER PACKAGES ARE INSTALLED
    # =========================================================================
    # lmn-appliance/lmn-prepare installs the server packages itself, but does not
    # check the return code and may run without DEBIAN_FRONTEND -> packages with
    # debconf questions make the install stop silently in a non-interactive run,
    # so /usr/sbin/linuxmuster-setup is missing. Therefore install them here
    # explicitly and non-interactively (idempotent, clear error message).

    - name: Finish half-configured packages
      ansible.builtin.command:
        cmd: dpkg --configure -a
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: false

    - name: Install the linuxmuster server packages (non-interactive)
      ansible.builtin.apt:
        name:
          - linuxmuster-base7
          - linuxmuster-webui7
          - linuxmuster-linbo7
          - linuxmuster-linbo-gui7
          - sophomorix-samba
        state: latest
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Make sure linuxmuster-setup is present
      ansible.builtin.stat:
        path: /usr/sbin/linuxmuster-setup
      register: lmn_setup_bin

    - name: Stop if linuxmuster-setup is missing
      ansible.builtin.assert:
        that: lmn_setup_bin.stat.exists
        fail_msg: >-
          /usr/sbin/linuxmuster-setup is missing - the linuxmuster server packages
          could not be installed. Please check 'apt-get install
          linuxmuster-base7' (repository/dependencies).

    # =========================================================================
    # LINUXMUSTER-SETUP CONFIGURATION FILE
    # =========================================================================

    - name: Create the setup configuration directory
      ansible.builtin.file:
        path: /root/.linuxmuster
        state: directory
        mode: '0700'

    # NOTE: lmn_adminpw must not contain the characters $ and %.
    # linuxmuster-setup reads the ini with Python's ConfigParser, whose
    # interpolation evaluates $... and %(...)s sequences and would otherwise
    # damage the password. The web UI already validates this; when calling
    # ansible-playbook directly, the caller has to make sure of it.
    - name: Create the setup configuration file
      ansible.builtin.copy:
        content: |
          [setup]
          serverip = {{ lmn_server_ip }}
          netmask = {{ lmn_netmask }}
          bitmask = {{ lmn_cidr }}
          gatewayip = {{ lmn_gateway }}
          firewallip = {{ lmn_gateway }}
          servername = {{ lmn_servername }}
          domainname = {{ lmn_domainname }}
          dhcprange = {{ lmn_dhcprange }}
          schoolname = {{ lmn_schoolname }}
          location = {{ lmn_location }}
          country = {{ lmn_country }}
          state = {{ lmn_state }}
          adminpw = {{ lmn_adminpw }}
          skipfw = {{ lmn_skip_firewall | ternary('True', 'False') }}
        dest: /root/.linuxmuster/setup.ini
        mode: '0600'
      no_log: true

    # =========================================================================
    # RUN LINUXMUSTER-SETUP
    # =========================================================================

    - name: Run linuxmuster-setup
      ansible.builtin.shell: |
        set -o pipefail
        /usr/sbin/linuxmuster-setup \
          --config=/root/.linuxmuster/setup.ini \
          {% if lmn_unattended %}--unattended{% endif %} \
          {% if lmn_skip_firewall %}--skip-fw{% endif %} \
          2>&1 | while IFS= read -r line; do
          echo "$line"
        done
      args:
        executable: /bin/bash
        creates: /var/lib/linuxmuster/.setup.done
      register: lmn_setup_result
      changed_when: lmn_setup_result.rc == 0
      async: 3600
      poll: 30

    # =========================================================================
    # POST-SETUP TASKS
    # =========================================================================

    - name: Protect the setup log files
      ansible.builtin.file:
        path: '{{ item }}'
        mode: '0600'
      loop:
        - /var/log/linuxmuster/setup.log
      ignore_errors: true

    - name: Create the marker file for a successful installation
      ansible.builtin.file:
        path: /var/lib/linuxmuster/.setup.done
        state: touch
        mode: '0644'
      when: lmn_setup_result is defined and lmn_setup_result.rc == 0

    # linuxmuster-setup puts "dns forwarder = <firewallip>" into smb.conf.
    # Without a firewall that is a dead resolver -> external DNS names
    # (deb.linuxmuster.net, archive.ubuntu.com, ...) no longer resolve.
    # Point it to a working forwarder before Samba restarts so that the
    # following apt tasks do not fail.
    - name: Set the DNS forwarder in smb.conf to a working resolver
      ansible.builtin.replace:
        path: /etc/samba/smb.conf
        regexp: '^(\s*dns forwarder\s*=\s*).*$'
        replace: '\g<1>{{ lmn_dns_forwarder }}'

    - name: Restart Samba AD DC
      ansible.builtin.systemd:
        name: samba-ad-dc
        state: restarted
        enabled: true

    - name: Wait until Samba LDAP is ready
      ansible.builtin.shell: |
        for i in $(seq 1 30); do
          if samba-tool user show Administrator >/dev/null 2>&1; then
            echo "Samba LDAP ready after $i attempts"
            exit 0
          fi
          sleep 5
        done
        echo "Samba LDAP not reachable after 150 seconds"
        exit 1
      changed_when: false

    - name: Check external DNS resolution (not critical)
      ansible.builtin.command:
        cmd: getent hosts deb.linuxmuster.net
      register: lmn_dns_check
      until: lmn_dns_check.rc == 0
      retries: 6
      delay: 5
      changed_when: false
      failed_when: false

    - name: Note when external DNS resolution does not work
      ansible.builtin.debug:
        msg: >-
          External name resolution (deb.linuxmuster.net) through the DNS forwarder
          {{ lmn_dns_forwarder }} does not work. Behind a proxy this is often
          normal (apt goes through the proxy). If apt tasks fail afterwards,
          please check lmn_dns_forwarder.
      when: lmn_dns_check.rc != 0

    # =========================================================================
    # CREATE THE EDULUTION BIND USER (via sophomorix)
    # =========================================================================

    - name: Compute the domain components
      ansible.builtin.set_fact:
        edulution_dc_parts: "{{ lmn_domainname.split('.') | map('regex_replace', '^(.*)$', 'DC=\\1') | join(',') }}"

    - name: Check whether edulutionui-binduser already exists
      ansible.builtin.command:
        cmd: samba-tool user show edulutionui-binduser
      register: binduser_exists
      failed_when: false
      changed_when: false

    # After the samba-ad-dc restart, samba-tool (local DB) already answers
    # while the network LDAP that sophomorix uses is not ready yet
    # ("No connection to Samba4 AD!"). So repeat the call with a short delay
    # until the connection works (nothing is created before that).
    - name: Create edulutionui-binduser with sophomorix
      ansible.builtin.command:
        cmd: >
          sophomorix-admin
          --create-global-binduser edulutionui-binduser
          --random-passwd-save
      register: binduser_create_result
      # sophomorix-admin prints the generated password.
      no_log: true
      when: binduser_exists.rc != 0
      until: binduser_create_result.rc == 0
      retries: 12
      delay: 5

    - name: Debug - bind user creation result
      ansible.builtin.debug:
        msg: |
          rc: {{ binduser_create_result.rc | default('skipped') }}

    - name: Read the bind user password from the linuxmuster secret
      ansible.builtin.command:
        cmd: cat /etc/linuxmuster/.secret/edulutionui-binduser
      register: binduser_pw_result
      changed_when: false
      no_log: true

    - name: Create the edulution configuration directory
      ansible.builtin.file:
        path: /var/lib/edulution
        state: directory
        mode: '0700'

    - name: Write the edulution bind user configuration
      ansible.builtin.copy:
        # One expression: a password assigned as its own template would become a list or bool under ansible-core 2.16.
        content: |
          {{ {
            'binduser_dn': 'CN=edulutionui-binduser,OU=Management,OU=GLOBAL,' ~ edulution_dc_parts,
            'binduser_password': binduser_pw_result.stdout | trim,
          } | to_nice_json }}
        dest: /var/lib/edulution/binduser-config.json
        mode: '0600'
      no_log: true

    # =========================================================================
    # INSTALL LINUXMUSTER-API
    # =========================================================================

    - name: Wait for the apt lock (post-setup)
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

    - name: Install linuxmuster-api7
      ansible.builtin.apt:
        name: linuxmuster-api7
        state: present
        update_cache: true

    - name: Create the systemd override directory for linuxmuster-api
      ansible.builtin.file:
        path: /etc/systemd/system/linuxmuster-api.service.d
        state: directory
        mode: '0755'

    - name: Create the systemd override for linuxmuster-api (Samba dependency)
      ansible.builtin.copy:
        content: |
          [Unit]
          After=samba-ad-dc.service
          Requires=samba-ad-dc.service

          [Service]
          Restart=on-failure
          RestartSec=10
        dest: /etc/systemd/system/linuxmuster-api.service.d/override.conf
        mode: '0644'

    - name: Reload the systemd configuration
      ansible.builtin.systemd:
        daemon_reload: true

    # =========================================================================
    # ADJUST THE AJENTI PORT (local installation only)
    # =========================================================================
    # On the same machine the edulution Traefik uses host port 443. So that the
    # Ajenti web UI (linuxmuster.net) does not collide with it, it is moved to
    # lmn_webui_port.

    - name: Adjust the Ajenti port (local installation)
      ansible.builtin.replace:
        path: /etc/ajenti/config.yml
        regexp: '(^\s*port:\s*)443\b'
        replace: '\g<1>{{ lmn_webui_port }}'
      when: lmn_local_install | bool
      notify: Restart the linuxmuster web UI

    # =========================================================================
    # REBOOT REPLACEMENT: targeted service restarts instead of a full reboot
    # =========================================================================
    # linuxmuster.net recommends a reboot after the setup. Where that is not
    # possible, we replace it as far as it makes sense:
    #  - needrestart restarts services with outdated libraries (apt upgrade)
    #  - the LMN stack is restarted so that it reads the new configuration --
    #    deliberately WITHOUT the network (netplan/IP change), so the current
    #    connection is not cut.
    #  - If a kernel update remains, a real reboot is still needed; this is
    #    reported at the end.

    - name: Install needrestart (if missing)
      ansible.builtin.apt:
        name: needrestart
        state: present
      failed_when: false

    - name: Restart services with outdated libraries automatically
      ansible.builtin.command:
        cmd: needrestart -r a -b
      register: needrestart_auto
      changed_when: false
      failed_when: false

    - name: Gather the installed services
      ansible.builtin.service_facts:

    - name: Restart the LMN stack (reboot replacement, without the network)
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: restarted
      loop:
        - isc-dhcp-server
        - ntpsec
        - apparmor
        - linuxmuster-api
        - linuxmuster-webui
      when: (item ~ '.service') in ansible_facts.services
      failed_when: false

    - name: Check whether a kernel reboot is needed
      ansible.builtin.command:
        cmd: needrestart -k -b
      register: needrestart_kernel
      changed_when: false
      failed_when: false

    - name: Remember the kernel reboot status
      ansible.builtin.set_fact:
        lmn_kernel_reboot_required: "{{ 'NEEDRESTART-KSTA: 3' in (needrestart_kernel.stdout | default('')) }}"

    # =========================================================================
    # FINAL MESSAGE
    # =========================================================================

    - name: Installation finished
      ansible.builtin.debug:
        msg: |
          ====================================================================
          LINUXMUSTER.NET {{ lmn_version_label }} INSTALLATION FINISHED
          ====================================================================

          Server: {{ lmn_servername }}.{{ lmn_domainname }}
          IP:     {{ lmn_server_ip }}

          Web UI: https://{{ lmn_server_ip }}{{ (':' + lmn_webui_port | string) if (lmn_local_install | bool) else '' }}
          Login:  global-admin (password from the setup)

          edulution bind user: CN=edulutionui-binduser,OU=Management,OU=GLOBAL,{{ edulution_dc_parts }}

          Services were restarted selectively (reboot replacement, without the network).
          {{ 'WARNING: The kernel was updated - a real reboot is needed!'
             if (lmn_kernel_reboot_required | default(false) | bool)
             else 'No kernel reboot needed - the service restarts are sufficient.' }}

          ====================================================================

  # ===========================================================================
  # HANDLERS
  # ===========================================================================

  handlers:
    # Ubuntu's 50unattended-upgrades only allows Ubuntu's own release and security sources; linuxmuster packages stay manual.
    - name: Switch on automatic security updates in 20auto-upgrades
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: '^APT::Periodic::Unattended-Upgrade'
        line: 'APT::Periodic::Unattended-Upgrade "1";'
        create: true
        mode: '0644'
      listen: Switch automatic security updates back on

    - name: Start unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: true
        state: started
      listen: Switch automatic security updates back on

    - name: Restart the linuxmuster web UI
      ansible.builtin.systemd:
        name: linuxmuster-webui
        state: restarted

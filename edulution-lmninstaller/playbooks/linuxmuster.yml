---
# =============================================================================
# LINUXMUSTER.NET 7.3 / 7.4 INSTALLATION PLAYBOOK
# (Version automatisch nach Ubuntu: 24.04 -> 7.3 (lmn73), 26.04 -> 7.4 (lmn74))
# =============================================================================
#
# Verwendung:
#   1. Variablen in vars/linuxmuster.yml anpassen
#   2. ansible-playbook main.yml -e @vars/linuxmuster.yml
#
#   Oder via API mit extra_vars:
#   POST /api/playbook/start
#   {
#     "variables": {
#       "extra_vars": {
#         "lmn_schoolname": "Meine Schule",
#         "lmn_adminpw": "MeinPasswort1!"
#       }
#     }
#   }
#
# =============================================================================

- name: linuxmuster.net 7.3/7.4 Installation
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  # Variablen können überschrieben werden durch:
  # 1. vars/linuxmuster.yml Datei
  # 2. -e / --extra-vars auf der Kommandozeile
  # 3. API extra_vars

  vars:
    # -------------------------------------------------------------------------
    # STANDARD-WERTE (werden durch extra_vars überschrieben)
    # -------------------------------------------------------------------------
    # Extra-vars via -e oder API überschreiben diese Werte automatisch

    # Netzwerk
    lmn_server_ip: '10.0.0.1'
    lmn_netmask: '255.255.0.0'
    lmn_gateway: '10.0.0.254'

    # DNS-Forwarder fuer die Samba-interne DNS.
    # linuxmuster-setup schreibt in die smb.conf zwingend
    # "dns forwarder = <firewallip>". Ohne installierte Firewall zeigt das ins
    # Leere und die externe Namensaufloesung (und damit apt) schlaegt fehl.
    # Daher setzen wir nach dem Setup einen funktionierenden Resolver.
    lmn_dns_forwarder: '9.9.9.9'

    # Server
    lmn_servername: 'server'
    lmn_domainname: 'linuxmuster.lan'

    # Schule
    lmn_schoolname: 'Meine Schule'
    lmn_location: 'Musterstadt'
    lmn_country: 'de'
    lmn_state: 'BW'

    # DHCP
    lmn_dhcprange: '10.0.100.1 10.0.100.254'

    # Admin-Passwort (MUSS überschrieben werden!)
    lmn_adminpw: 'Muster!'

    # System
    lmn_timezone: 'Europe/Berlin'
    lmn_locale: 'de_DE.UTF-8'

    # Erweiterte Optionen
    lmn_skip_firewall: true
    lmn_unattended: true
    lmn_disable_auto_updates: true

    # Lokale Installation (edulution-UI und LMN-Server auf derselben Maschine).
    # Wird bei "gleiche Maschine" in der Installer-UI auf true gesetzt.
    # In diesem Fall kollidiert die Ajenti-Web-UI (Port 443) mit dem Traefik
    # von edulution, daher wird Ajenti auf lmn_webui_port verschoben.
    lmn_local_install: false
    lmn_webui_port: 8443

    # Datenplatte: linuxmuster legt seine Daten (/srv/samba, /srv/linbo) und /var
    # auf einer zweiten Platte via LVM ab. Das erledigt lmn-appliance/lmn-prepare
    # selbst, wenn man ihm die Platte per -l uebergibt (VG vg_srv, Volumes s.u.,
    # Quota auf global/default-school). Ist eine zweite, LEERE Platte vorhanden,
    # uebergeben wir sie automatisch.
    lmn_setup_data_disk: true
    # Leer lassen -> automatische Erkennung der ersten komplett leeren
    # Nicht-System-Platte (z.B. /dev/vdb, /dev/sdb). Sonst Geraet explizit setzen.
    lmn_data_disk: ''
    # Leer lassen -> Standard von lmn-prepare:
    # var:10,linbo:40,global:10,default-school:100%FREE
    lmn_lvm_volumes: ''

    # Firewall wird standardmaessig NICHT installiert (lmn_skip_firewall: true).
    # Die Firewall muss separat eingerichtet werden.

    # Repository (normalerweise nicht ändern)
    lmn_repo_url: 'https://deb.linuxmuster.net/'
    lmn_repo_gpg_url: 'https://deb.linuxmuster.net/pub.gpg'
    # linuxmuster-Version automatisch anhand der Ubuntu-Version:
    #   Ubuntu 24.04 -> lmn73 (7.3),  Ubuntu 26.04 -> lmn74 (7.4).
    # lmn_repo_distribution/lmn_prepare_version werden daraus per set_fact
    # abgeleitet (per -e ueberschreibbar). Nur 7.3 nutzt eine separate Datenplatte
    # via LVM (lmn-appliance -l/--pvdevice); 7.4 hat das LVM-Setup abgeschafft und
    # installiert direkt auf die Systemplatte -> dort wird kein -l uebergeben.
    lmn_version_map:
      '24': { distribution: 'lmn73', prepare_version: 'v7.3.1', label: '7.3', pvdevice: true }
      '26': { distribution: 'lmn74', prepare_version: 'v7.4.0', label: '7.4', pvdevice: false }
    lmn_appliance_url: 'https://raw.githubusercontent.com/linuxmuster/linuxmuster-prepare/{{ lmn_prepare_version }}/lmn-appliance'

    # Pakete
    lmn_additional_packages:
      - net-tools
      - iputils-ping
      - dnsutils
      - qemu-guest-agent
      - apt-utils
      - locales
      - wget
      - curl
      - gnupg
      - lvm2

  tasks:
    # =========================================================================
    # GRUNDLEGENDE SYSTEMKONFIGURATION
    # =========================================================================

    - name: Betriebssystem pruefen (Ubuntu 24.04 -> 7.3, 26.04 -> 7.4)
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version in ['24', '26']
        fail_msg: >-
          linuxmuster.net benoetigt Ubuntu 24.04 (-> 7.3) oder 26.04 (-> 7.4).
          Gefunden: {{ ansible_distribution }} {{ ansible_distribution_version }}
        success_msg: 'Ubuntu {{ ansible_distribution_version }} erkannt'

    - name: linuxmuster-Version anhand der Ubuntu-Version bestimmen
      ansible.builtin.set_fact:
        lmn_repo_distribution: "{{ lmn_version_map[ansible_distribution_major_version].distribution }}"
        lmn_prepare_version: "{{ lmn_version_map[ansible_distribution_major_version].prepare_version }}"
        lmn_version_label: "{{ lmn_version_map[ansible_distribution_major_version].label }}"
        lmn_appliance_supports_pvdevice: "{{ lmn_version_map[ansible_distribution_major_version].pvdevice }}"

    - name: Gewaehlte linuxmuster-Version anzeigen
      ansible.builtin.debug:
        msg: >-
          Ubuntu {{ ansible_distribution_version }} erkannt -> linuxmuster.net
          {{ lmn_version_label }} ({{ lmn_repo_distribution }}, lmn-appliance
          {{ lmn_prepare_version }})

    - name: Warten bis apt-Lock frei ist
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

    - name: Unattended-upgrades stoppen und deaktivieren
      ansible.builtin.shell: |
        systemctl stop unattended-upgrades 2>/dev/null || true
        systemctl disable unattended-upgrades 2>/dev/null || true
        killall -9 unattended-upgr 2>/dev/null || true
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          sleep 3
        done
      changed_when: false

    - name: Zeitzone konfigurieren
      community.general.timezone:
        name: '{{ lmn_timezone }}'

    - name: Cloud-init deaktivieren
      ansible.builtin.file:
        path: /etc/cloud/cloud-init.disabled
        state: touch
        mode: '0644'
      ignore_errors: true

    - name: Warten bis apt-Lock frei ist (vor cloud-init)
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

    - name: Cloud-init Paket entfernen
      ansible.builtin.apt:
        name: cloud-init
        state: absent
        purge: true
      ignore_errors: true

    - name: Cloud-init Verzeichnisse entfernen
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/cloud
        - /var/lib/cloud
      ignore_errors: true

    - name: Erforderliche Pakete installieren
      ansible.builtin.apt:
        name: '{{ lmn_additional_packages }}'
        state: present
        update_cache: true

    - name: Locale generieren
      community.general.locale_gen:
        name: '{{ lmn_locale }}'
        state: present

    - name: Locale als Standard setzen
      ansible.builtin.command:
        cmd: localectl set-locale LANG={{ lmn_locale }}
      changed_when: true

    # =========================================================================
    # AUTOMATISCHE UPDATES DEAKTIVIEREN
    # =========================================================================

    - name: Automatische Updates deaktivieren
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: '^APT::Periodic::Unattended-Upgrade'
        line: 'APT::Periodic::Unattended-Upgrade "0";'
        create: true
        mode: '0644'
      when: lmn_disable_auto_updates

    # =========================================================================
    # QEMU GUEST AGENT (für Virtualisierung)
    # =========================================================================

    - name: QEMU Guest Agent aktivieren
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started
      ignore_errors: true

    # =========================================================================
    # SERIAL CONSOLE (für Proxmox)
    # =========================================================================

    - name: Serial Console Service aktivieren
      ansible.builtin.systemd:
        name: serial-getty@ttyS0.service
        enabled: true
        state: started
      ignore_errors: true

    # =========================================================================
    # SYSTEM-UPDATE
    # =========================================================================

    - name: System aktualisieren
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

    # =========================================================================
    # LINUXMUSTER.NET REPOSITORY
    # =========================================================================

    - name: GPG-Schlüssel herunterladen
      ansible.builtin.get_url:
        url: '{{ lmn_repo_gpg_url }}'
        dest: /tmp/linuxmuster.gpg
        mode: '0644'

    - name: GPG-Schlüssel konvertieren und installieren
      ansible.builtin.shell: |
        cat /tmp/linuxmuster.gpg | gpg --dearmor -o /usr/share/keyrings/linuxmuster.net.gpg
      args:
        creates: /usr/share/keyrings/linuxmuster.net.gpg

    - name: linuxmuster Repository hinzufügen
      ansible.builtin.apt_repository:
        repo: 'deb [arch=amd64 signed-by=/usr/share/keyrings/linuxmuster.net.gpg] {{ lmn_repo_url }} {{ lmn_repo_distribution }} main'
        filename: lmn
        state: present

    - name: Paketlisten aktualisieren
      ansible.builtin.apt:
        update_cache: true

    # =========================================================================
    # LMN-APPLIANCE SCRIPT
    # =========================================================================

    - name: lmn-appliance Script herunterladen
      ansible.builtin.get_url:
        url: '{{ lmn_appliance_url }}'
        dest: /root/lmn-appliance
        mode: '0755'

    - name: Netzmaske in CIDR-Notation umrechnen
      ansible.builtin.set_fact:
        lmn_cidr: "{{ (lmn_server_ip + '/' + lmn_netmask) | ansible.utils.ipaddr('prefix') }}"

    # -------------------------------------------------------------------------
    # DATENPLATTE ERMITTELN (wird per -l an lmn-appliance uebergeben)
    # -------------------------------------------------------------------------
    - name: Leere zweite Platte fuer LVM ermitteln
      ansible.builtin.shell: |
        # Erste vollstaendig leere Nicht-System-Platte:
        # keine Partitionen, kein Dateisystem, keine Signatur (fs/parttable/LVM).
        for d in $(lsblk -dn -o NAME,TYPE | awk '$2=="disk"{print $1}'); do
          dev="/dev/$d"
          [ "$(lsblk -n -o NAME "$dev" | wc -l)" -eq 1 ] || continue
          [ -z "$(lsblk -dn -o FSTYPE "$dev")" ] || continue
          blkid "$dev" >/dev/null 2>&1 && continue
          echo "$dev"; break
        done
      args:
        executable: /bin/bash
      register: lmn_detected_disk
      changed_when: false
      when: lmn_setup_data_disk | bool

    - name: Zu verwendende Datenplatte festlegen
      ansible.builtin.set_fact:
        lmn_data_disk_final: "{{ (lmn_data_disk | default('', true)) or (lmn_detected_disk.stdout | default('') | trim) }}"
      when: lmn_setup_data_disk | bool

    - name: Hinweis wenn keine leere Datenplatte gefunden wurde
      ansible.builtin.debug:
        msg: >-
          Keine leere zweite Platte gefunden - Installation erfolgt auf der
          Systemplatte (kein separates LVM). Vorhandene Platten werden nie
          ueberschrieben; ggf. lmn_data_disk explizit setzen.
      when:
        - lmn_setup_data_disk | bool
        - (lmn_data_disk_final | default('')) == ''

    - name: Hinweis Datenplatte (7.4 ohne separates LVM)
      ansible.builtin.debug:
        msg: >-
          linuxmuster.net {{ lmn_version_label }} verwendet kein separates
          Daten-LVM mehr - die Installation erfolgt direkt auf der Systemplatte.
          Eine evtl. erkannte zweite Platte ({{ lmn_data_disk_final }}) bleibt
          unangetastet.
      when:
        - lmn_setup_data_disk | bool
        - (lmn_data_disk_final | default('')) != ''
        - not (lmn_appliance_supports_pvdevice | default(false) | bool)

    - name: lmn-appliance ausführen (Server-Profil, LVM auf Datenplatte falls vorhanden)
      ansible.builtin.shell: |
        set -o pipefail
        /root/lmn-appliance -p server -u \
          -n {{ lmn_server_ip }}/{{ lmn_cidr }} \
          -f {{ lmn_gateway }} \
          -d {{ lmn_domainname }} \
          -t {{ lmn_servername }} \
          {{ ('-l ' + lmn_data_disk_final) if ((lmn_data_disk_final | default('')) != '' and (lmn_appliance_supports_pvdevice | default(false) | bool)) else '' }} \
          {{ ('-v ' + lmn_lvm_volumes) if ((lmn_lvm_volumes | default('')) != '' and (lmn_appliance_supports_pvdevice | default(false) | bool)) else '' }} \
          2>&1 | while IFS= read -r line; do
          echo "$line"
        done
      args:
        executable: /bin/bash
        creates: /etc/linuxmuster/.appliance_configured
      register: lmn_appliance_result
      changed_when: lmn_appliance_result.rc == 0
      async: 1800
      poll: 30

    # =========================================================================
    # LINUXMUSTER-SERVER-PAKETE SICHERSTELLEN
    # =========================================================================
    # lmn-appliance/lmn-prepare installiert die Server-Pakete zwar selbst, prueft
    # den Return-Code aber nicht und laeuft ggf. ohne DEBIAN_FRONTEND -> bei
    # Paketen mit debconf-Rueckfragen bricht der Install im nicht-interaktiven
    # Lauf still ab, sodass /usr/sbin/linuxmuster-setup fehlt. Daher hier explizit
    # und nicht-interaktiv nachziehen (idempotent, klare Fehlermeldung).

    - name: Halb-konfigurierte Pakete abschliessen
      ansible.builtin.command:
        cmd: dpkg --configure -a
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: false

    - name: linuxmuster-Server-Pakete installieren (nicht-interaktiv)
      ansible.builtin.apt:
        name:
          - linuxmuster-base7
          - linuxmuster-webui7
          - linuxmuster-linbo7
          - linuxmuster-linbo-gui7
          - sophomorix-samba
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Sicherstellen dass linuxmuster-setup vorhanden ist
      ansible.builtin.stat:
        path: /usr/sbin/linuxmuster-setup
      register: lmn_setup_bin

    - name: Abbrechen wenn linuxmuster-setup fehlt
      ansible.builtin.assert:
        that: lmn_setup_bin.stat.exists
        fail_msg: >-
          /usr/sbin/linuxmuster-setup fehlt - die linuxmuster-Server-Pakete
          konnten nicht installiert werden. Bitte 'apt-get install
          linuxmuster-base7' pruefen (Repo/Abhaengigkeiten).

    # =========================================================================
    # LINUXMUSTER-SETUP KONFIGURATIONSDATEI
    # =========================================================================

    - name: Setup-Konfigurationsverzeichnis erstellen
      ansible.builtin.file:
        path: /root/.linuxmuster
        state: directory
        mode: '0700'

    # HINWEIS: lmn_adminpw darf die Zeichen $ und % nicht enthalten.
    # linuxmuster-setup liest die ini mit Pythons ConfigParser ein, dessen
    # Interpolation $...-/%(...) s-Sequenzen auswertet und das Passwort
    # sonst beschädigt. Die Web-UI validiert das bereits; bei direktem
    # Aufruf via ansible-playbook muss der Aufrufer das selbst sicherstellen.
    - name: Setup-Konfigurationsdatei erstellen
      ansible.builtin.copy:
        content: |
          [setup]
          serverip = {{ lmn_server_ip }}
          netmask = {{ lmn_netmask }}
          gatewayip = {{ lmn_gateway }}
          firewallip = {{ lmn_gateway }}
          servername = {{ lmn_servername }}
          domainname = {{ lmn_domainname }}
          dhcprange = {{ lmn_dhcprange }}
          schoolname = {{ lmn_schoolname }}
          location = {{ lmn_location }}
          country = {{ lmn_country }}
          state = {{ lmn_state }}
          adminpw = {{ lmn_adminpw }}
          skipfw = {{ lmn_skip_firewall | ternary('True', 'False') }}
        dest: /root/.linuxmuster/setup.ini
        mode: '0600'

    # =========================================================================
    # LINUXMUSTER-SETUP AUSFÜHREN
    # =========================================================================

    - name: linuxmuster-setup ausführen
      ansible.builtin.shell: |
        set -o pipefail
        /usr/sbin/linuxmuster-setup \
          --config=/root/.linuxmuster/setup.ini \
          --adminpw='{{ lmn_adminpw }}' \
          {% if lmn_unattended %}--unattended{% endif %} \
          {% if lmn_skip_firewall %}--skip-fw{% endif %} \
          2>&1 | while IFS= read -r line; do
          echo "$line"
        done
      args:
        executable: /bin/bash
        creates: /var/lib/linuxmuster/.setup.done
      register: lmn_setup_result
      changed_when: lmn_setup_result.rc == 0
      async: 3600
      poll: 30

    # =========================================================================
    # POST-SETUP AUFGABEN
    # =========================================================================

    - name: Setup-Logdateien sichern
      ansible.builtin.file:
        path: '{{ item }}'
        mode: '0600'
      loop:
        - /var/log/linuxmuster/setup.log
      ignore_errors: true

    - name: Marker-Datei für erfolgreiche Installation erstellen
      ansible.builtin.file:
        path: /var/lib/linuxmuster/.setup.done
        state: touch
        mode: '0644'
      when: lmn_setup_result is defined and lmn_setup_result.rc == 0

    # linuxmuster-setup verankert "dns forwarder = <firewallip>" in der
    # smb.conf. Ohne Firewall ist das ein toter Resolver -> externe DNS-Namen
    # (deb.linuxmuster.net, archive.ubuntu.com, ...) lassen sich nicht mehr
    # aufloesen. Vor dem Samba-Neustart auf einen funktionierenden Forwarder
    # umbiegen, damit die anschliessenden apt-Tasks nicht scheitern.
    - name: DNS-Forwarder in smb.conf auf funktionierenden Resolver setzen
      ansible.builtin.replace:
        path: /etc/samba/smb.conf
        regexp: '^(\s*dns forwarder\s*=\s*).*$'
        replace: '\g<1>{{ lmn_dns_forwarder }}'

    - name: Samba AD DC neu starten
      ansible.builtin.systemd:
        name: samba-ad-dc
        state: restarted
        enabled: true

    - name: Warten bis Samba LDAP bereit ist
      ansible.builtin.shell: |
        for i in $(seq 1 30); do
          if samba-tool user show Administrator >/dev/null 2>&1; then
            echo "Samba LDAP bereit nach $i Versuchen"
            exit 0
          fi
          sleep 5
        done
        echo "Samba LDAP nicht erreichbar nach 150 Sekunden"
        exit 1
      changed_when: false

    - name: Warten bis externe DNS-Aufloesung funktioniert
      ansible.builtin.command:
        cmd: getent hosts deb.linuxmuster.net
      register: lmn_dns_check
      until: lmn_dns_check.rc == 0
      retries: 12
      delay: 5
      changed_when: false
      failed_when: lmn_dns_check.rc != 0

    # =========================================================================
    # EDULUTION BINDUSER ERSTELLEN (via sophomorix)
    # =========================================================================

    - name: Domain-Komponenten berechnen
      ansible.builtin.set_fact:
        edulution_dc_parts: "{{ lmn_domainname.split('.') | map('regex_replace', '^(.*)$', 'DC=\\1') | join(',') }}"

    - name: Pruefen ob edulutionui-binduser bereits existiert
      ansible.builtin.command:
        cmd: samba-tool user show edulutionui-binduser
      register: binduser_exists
      failed_when: false
      changed_when: false

    # Nach dem samba-ad-dc-Neustart antwortet samba-tool (lokale DB) bereits,
    # waehrend das Netzwerk-LDAP, das sophomorix nutzt, noch nicht bereit ist
    # ("No connection to Samba4 AD!"). Daher den Aufruf mit kurzem Delay
    # wiederholen, bis die Verbindung steht (nichts wird vorher angelegt).
    - name: edulutionui-binduser mit sophomorix erstellen
      ansible.builtin.command:
        cmd: >
          sophomorix-admin
          --create-global-binduser edulutionui-binduser
          --random-passwd-save
      register: binduser_create_result
      when: binduser_exists.rc != 0
      until: binduser_create_result.rc == 0
      retries: 12
      delay: 5

    - name: Debug - Binduser-Erstellung Ergebnis
      ansible.builtin.debug:
        msg: |
          rc: {{ binduser_create_result.rc | default('skipped') }}
          stdout: {{ binduser_create_result.stdout | default('skipped') }}
          stderr: {{ binduser_create_result.stderr | default('skipped') }}

    - name: Binduser-Passwort aus linuxmuster secret lesen
      ansible.builtin.command:
        cmd: cat /etc/linuxmuster/.secret/edulutionui-binduser
      register: binduser_pw_result
      changed_when: false

    - name: Binduser-Passwort als Fakt setzen
      ansible.builtin.set_fact:
        edulution_binduser_password: '{{ binduser_pw_result.stdout | trim }}'

    - name: Edulution-Konfigurationsverzeichnis erstellen
      ansible.builtin.file:
        path: /var/lib/edulution
        state: directory
        mode: '0700'

    - name: Edulution Binduser-Konfiguration schreiben
      ansible.builtin.copy:
        content: |
          {
            "binduser_dn": "CN=edulutionui-binduser,OU=Management,OU=GLOBAL,{{ edulution_dc_parts }}",
            "binduser_password": "{{ edulution_binduser_password }}"
          }
        dest: /var/lib/edulution/binduser-config.json
        mode: '0600'

    # =========================================================================
    # LINUXMUSTER-API INSTALLIEREN
    # =========================================================================

    - name: Warten bis apt-Lock frei ist (post-setup)
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

    - name: linuxmuster-api7 installieren
      ansible.builtin.apt:
        name: linuxmuster-api7
        state: present
        update_cache: true

    - name: systemd-Override-Verzeichnis fuer linuxmuster-api erstellen
      ansible.builtin.file:
        path: /etc/systemd/system/linuxmuster-api.service.d
        state: directory
        mode: '0755'

    - name: systemd-Override fuer linuxmuster-api erstellen (Samba-Abhaengigkeit)
      ansible.builtin.copy:
        content: |
          [Unit]
          After=samba-ad-dc.service
          Requires=samba-ad-dc.service

          [Service]
          Restart=on-failure
          RestartSec=10
        dest: /etc/systemd/system/linuxmuster-api.service.d/override.conf
        mode: '0644'

    - name: systemd-Konfiguration neu laden
      ansible.builtin.systemd:
        daemon_reload: true

    # =========================================================================
    # SSH-ZUGRIFF FUER EDULUTION-INSTALLER
    # =========================================================================
    # Erlaubt Root-/Passwort-Login ausschliesslich von localhost und aus dem
    # Docker-Bridge-Netz (docker0, 172.17.0.0/16). Wird immer angelegt, wirkt
    # sich aber nur auf Verbindungen aus diesen Netzen aus. Bei einer
    # "gleiche Maschine"-Installation erreicht der edulution-Container den
    # Host darueber ueber die docker0-IP.

    - name: SSH-Konfiguration fuer edulution-installer erstellen
      ansible.builtin.copy:
        content: |
          Match Address 127.0.0.1,172.17.0.0/16
              PermitRootLogin yes
              PasswordAuthentication yes
        dest: /etc/ssh/sshd_config.d/edulution_installer.conf
        owner: root
        group: root
        mode: '0644'
      notify: SSH-Dienst neustarten

    # =========================================================================
    # AJENTI-PORT ANPASSEN (nur bei lokaler Installation)
    # =========================================================================
    # Auf derselben Maschine belegt der edulution-Traefik den Host-Port 443.
    # Damit die Ajenti-Web-UI (linuxmuster.net) nicht kollidiert, wird sie auf
    # lmn_webui_port verschoben.

    - name: Ajenti-Port anpassen (lokale Installation)
      ansible.builtin.replace:
        path: /etc/ajenti/config.yml
        regexp: '(^\s*port:\s*)443\b'
        replace: '\g<1>{{ lmn_webui_port }}'
      when: lmn_local_install | bool
      notify: Linuxmuster-WebUI neustarten

    # =========================================================================
    # REBOOT-ERSATZ: gezielte Dienst-Neustarts statt vollem Neustart
    # =========================================================================
    # linuxmuster.net empfiehlt nach dem Setup einen Reboot. Wo das nicht moeglich
    # ist, ersetzen wir ihn so weit wie sinnvoll:
    #  - needrestart startet Dienste mit veralteten Bibliotheken neu (apt-Upgrade)
    #  - der LMN-Stack wird gezielt neu gestartet, damit er die neue Konfiguration
    #    liest -- bewusst OHNE Netzwerk (netplan/IP-Wechsel), um die laufende
    #    Verbindung nicht zu kappen.
    #  - Bleibt ein Kernel-Update, ist ein echter Reboot weiterhin noetig; das
    #    wird am Ende gemeldet.

    - name: needrestart installieren (falls nicht vorhanden)
      ansible.builtin.apt:
        name: needrestart
        state: present
      failed_when: false

    - name: Dienste mit veralteten Bibliotheken automatisch neu starten
      ansible.builtin.command:
        cmd: needrestart -r a -b
      register: needrestart_auto
      changed_when: false
      failed_when: false

    - name: Installierte Dienste ermitteln
      ansible.builtin.service_facts:

    - name: LMN-Stack neu starten (Reboot-Ersatz, ohne Netzwerk)
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: restarted
      loop:
        - isc-dhcp-server
        - ntpsec
        - apparmor
        - linuxmuster-api
        - linuxmuster-webui
      when: (item ~ '.service') in ansible_facts.services
      failed_when: false

    - name: Pruefen ob ein Kernel-Reboot noetig ist
      ansible.builtin.command:
        cmd: needrestart -k -b
      register: needrestart_kernel
      changed_when: false
      failed_when: false

    - name: Kernel-Reboot-Status merken
      ansible.builtin.set_fact:
        lmn_kernel_reboot_required: "{{ 'NEEDRESTART-KSTA: 3' in (needrestart_kernel.stdout | default('')) }}"

    # =========================================================================
    # ABSCHLUSSMELDUNG
    # =========================================================================

    - name: Installation abgeschlossen
      ansible.builtin.debug:
        msg: |
          ====================================================================
          LINUXMUSTER.NET {{ lmn_version_label }} INSTALLATION ABGESCHLOSSEN
          ====================================================================

          Server: {{ lmn_servername }}.{{ lmn_domainname }}
          IP:     {{ lmn_server_ip }}

          Web-UI: https://{{ lmn_server_ip }}{{ (':' + lmn_webui_port | string) if (lmn_local_install | bool) else '' }}
          Login:  global-admin / {{ lmn_adminpw }}

          edulution Binduser: CN=edulutionui-binduser,OU=Management,OU=GLOBAL,{{ edulution_dc_parts }}

          Dienste wurden gezielt neugestartet (Reboot-Ersatz, ohne Netzwerk).
          {{ 'ACHTUNG: Der Kernel wurde aktualisiert - ein echter Reboot ist noetig!'
             if (lmn_kernel_reboot_required | default(false) | bool)
             else 'Kein Kernel-Reboot noetig - die Dienst-Neustarts genuegen.' }}

          ====================================================================

  # ===========================================================================
  # HANDLERS
  # ===========================================================================

  handlers:
    - name: SSH-Dienst neustarten
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Linuxmuster-WebUI neustarten
      ansible.builtin.systemd:
        name: linuxmuster-webui
        state: restarted

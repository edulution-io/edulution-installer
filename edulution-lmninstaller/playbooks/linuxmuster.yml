---
# =============================================================================
# LINUXMUSTER.NET 7.4 INSTALLATION PLAYBOOK (Ubuntu 26.04)
# =============================================================================
#
# Usage:
#   ansible-playbook linuxmuster.yml -e lmn_schoolname="Meine Schule" -e lmn_adminpw="..."
#
#   Or via the API with extra_vars:
#   POST /api/playbook/start
#   {
#     "variables": {
#       "extra_vars": {
#         "lmn_schoolname": "Meine Schule",
#         "lmn_adminpw": "MeinPasswort1!"
#       }
#     }
#   }
#
# =============================================================================

- name: linuxmuster.net 7.4 installation
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  # So that the paused automatic updates are switched back on after a failed task as well.
  force_handlers: true

  # Pass the system proxy (if set) to all tasks so that get_url/curl/apt also
  # work behind a proxy. The values are read early from /etc/environment
  # (empty = no proxy).
  environment:
    http_proxy: "{{ lmn_http_proxy | default('') }}"
    https_proxy: "{{ lmn_https_proxy | default('') }}"
    HTTP_PROXY: "{{ lmn_http_proxy | default('') }}"
    HTTPS_PROXY: "{{ lmn_https_proxy | default('') }}"
    no_proxy: "{{ lmn_no_proxy | default('') }}"
    NO_PROXY: "{{ lmn_no_proxy | default('') }}"

  # Variables can be overridden by:
  # 1. -e / --extra-vars on the command line
  # 2. API extra_vars (only the settings in ALLOWED_EXTRA_VARS, api/models.py)

  vars:
    # -------------------------------------------------------------------------
    # DEFAULTS (overridden by extra_vars)
    # -------------------------------------------------------------------------
    # Extra vars passed with -e or through the API override these values.

    # Network
    lmn_server_ip: '10.0.0.1'
    lmn_netmask: '255.255.0.0'
    lmn_gateway: '10.0.0.254'

    # DNS forwarder for the Samba internal DNS.
    # linuxmuster-setup always writes "dns forwarder = <firewallip>" into
    # smb.conf. Without an installed firewall that points nowhere. 'auto' reads
    # the upstream DNS the host actually uses (from /run/systemd/resolve/resolv.conf
    # or resolv.conf) and uses it; only if none is found, it falls back to 9.9.9.9.
    # Set a fixed one with -e lmn_dns_forwarder=<ip>.
    lmn_dns_forwarder: 'auto'

    # Server
    lmn_servername: 'server'
    lmn_domainname: 'linuxmuster.lan'

    # School
    lmn_schoolname: 'Meine Schule'
    lmn_location: 'Musterstadt'
    lmn_country: 'de'
    lmn_state: 'BW'

    # DHCP
    lmn_dhcprange: '10.0.100.1 10.0.100.254'

    # Admin password (MUST be overridden!)
    lmn_adminpw: 'Muster!'

    # System
    lmn_timezone: 'Europe/Berlin'
    lmn_locale: 'de_DE.UTF-8'

    # Advanced options
    lmn_skip_firewall: true
    lmn_unattended: true
    # Pauses automatic updates only during the installation; security updates run again afterwards.
    lmn_disable_auto_updates: true

    # Local installation (edulution UI and LMN server on the same machine).
    # Set to true for "same machine" in the installer UI. The edulution
    # Traefik then holds port 443, so WebDAV moves to lmn_webui_port.
    lmn_local_install: false
    lmn_webui_port: 8443

    # edulution-fileproxy serves WebDAV where the web UI did: on 443, or on
    # lmn_webui_port for a local installation. The edulution installer expects it there.
    lmn_fileproxy_port: "{{ lmn_webui_port if (lmn_local_install | bool) else 443 }}"
    lmn_fileproxy_ca: /etc/edulution-fileproxy/dc-ca.pem
    lmn_fileproxy_ldap_host: '{{ lmn_servername }}.{{ lmn_domainname }}'
    # A config.yml configured on this host is kept unless this is true.
    lmn_fileproxy_rewrite_config: false

    # The firewall is NOT installed by default (lmn_skip_firewall: true).
    # It has to be set up separately.

    # Repository (normally left unchanged)
    lmn_repo_url: 'https://package.edulution.io/'
    lmn_repo_gpg_url: 'https://package.edulution.io/pub.gpg'
    # Fingerprints of the edulution archive keys; lmn-appliance gets these keys as well.
    # Both stay accepted while the repository key is rotated (edulution-package-server#50).
    lmn_repo_key_fingerprints:
      - 'DD8F6E92D5B8F2333450AD69BD35E6DB4655161B'  # gitleaks:allow
      - 'D40E9D60D4D78DE744D56538CDA6FAD3A2E91A18'  # gitleaks:allow
    lmn_repo_key_download: /root/edulution.asc
    # The path edulution-archive-keyring owns. linuxmuster-prepare depends on
    # that package, which takes the file over and brings rotated keys with apt
    # upgrade; lmn-appliance writes the same path, so both installation paths
    # end up with the same keyring.
    lmn_repo_keyring: /usr/share/keyrings/edulution.gpg
    lmn_appliance_global_key: /etc/apt/trusted.gpg.d/linuxmuster.net.gpg
    lmn_repo_list: /etc/apt/sources.list.d/edulution.list
    lmn_repo_sources: /etc/apt/sources.list.d/edulution.sources
    lmn_appliance_script: /root/lmn-appliance
    lmn_repo_key_fprs: "{{ lmn_repo_key_fingerprints | map('replace', ' ', '') | map('upper') | list }}"
    # Primary key fingerprints from lmn_key_lines (set per check); gpg prints a key's
    # fpr line right after its pub line. The checks reject sec lines (secret keys) outright.
    lmn_key_primary_fprs: >-
      {{ lmn_key_lines[:-1] | zip(lmn_key_lines[1:]) | selectattr('0', 'match', '^pub:')
         | map(attribute='1') | map('split', ':') | map(attribute='9') | list }}
    # The suites of package.edulution.io are Ubuntu codenames, not lmnNN.
    lmn_repo_deb_line: 'deb [arch=amd64 signed-by={{ lmn_repo_keyring }}] {{ lmn_repo_url }} {{ lmn_repo_suite }} main'
    # Lines in lmn-appliance that are switched to the checked keys.
    lmn_appliance_key_lines:
      lmnkey_remote: "lmnkey_remote = 'file://{{ lmn_repo_key_download }}'"
      lmnkey_local: "lmnkey_local = '{{ lmn_repo_keyring }}'"
    # linuxmuster version by Ubuntu version; new installations use 7.4 on Ubuntu 26.04 only.
    # lmn_repo_distribution/lmn_prepare_version are derived from it with set_fact
    # (can be overridden with -e; another lmn-appliance version also needs
    # lmn_prepare_commit and lmn_appliance_sha256).
    # lmn-appliance is downloaded at the tag's commit and checked against the checksum;
    # a new tag needs both values updated.
    lmn_version_map:
      '26':
        distribution: 'lmn74'
        suite: 'resolute'
        prepare_version: '1:7.4.2~edu'
        prepare_commit: '63703a53651c93d4c4002ea57bfe641953f2ca23'
        appliance_sha256: '417011d9a2c0ac592ba3bc640bd8a1ac55de76c75cf18c81b732c2601b1a4652'
        label: '7.4'
    lmn_appliance_url: 'https://raw.githubusercontent.com/edulution-io/linuxmuster-prepare/{{ lmn_prepare_commit }}/lmn-appliance'

    # Packages
    lmn_additional_packages:
      - net-tools
      - iputils-ping
      - dnsutils
      - qemu-guest-agent
      - apt-utils
      - locales
      - wget
      - curl
      - gnupg
      - lvm2
      # Marked as manually installed so that a later autoremove does not take the package with it.
      - unattended-upgrades

  tasks:
    # =========================================================================
    # BASIC SYSTEM CONFIGURATION
    # =========================================================================

    - name: Check the operating system (Ubuntu 26.04 -> linuxmuster.net 7.4)
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version in lmn_version_map
        fail_msg: >-
          linuxmuster.net 7.4 requires Ubuntu 26.04, found: {{ ansible_distribution }}
          {{ ansible_distribution_version }}. Please run a release upgrade to Ubuntu 26.04
          first (do-release-upgrade) and then start the installation again.
        success_msg: 'Ubuntu {{ ansible_distribution_version }} detected'

    # setup.ini takes one value per line; a line break would add another setting.
    - name: Check the settings
      ansible.builtin.assert:
        that:
          - lmn_adminpw | string | trim | length > 0
          - lmn_adminpw != 'Muster!'
          - >-
            (lmn_server_ip ~ lmn_netmask ~ lmn_gateway ~ lmn_servername ~ lmn_domainname
            ~ lmn_dhcprange ~ lmn_schoolname ~ lmn_location ~ lmn_country ~ lmn_state ~ lmn_adminpw)
            is not search('[\r\n]')
        fail_msg: >-
          Please set your own admin password (-e lmn_adminpw=...). The values for
          setup.ini must not contain a line break.

    - name: Determine the linuxmuster version from the Ubuntu version
      ansible.builtin.set_fact:
        lmn_repo_distribution: "{{ lmn_version_map[ansible_distribution_major_version].distribution }}"
        lmn_repo_suite: "{{ lmn_version_map[ansible_distribution_major_version].suite }}"
        lmn_prepare_version: "{{ lmn_version_map[ansible_distribution_major_version].prepare_version }}"
        lmn_prepare_commit: "{{ lmn_version_map[ansible_distribution_major_version].prepare_commit }}"
        lmn_appliance_sha256: "{{ lmn_version_map[ansible_distribution_major_version].appliance_sha256 }}"
        lmn_version_label: "{{ lmn_version_map[ansible_distribution_major_version].label }}"

    # Values set with -e take precedence over set_fact; another version needs its own commit and checksum.
    - name: Check the lmn-appliance version and commit
      ansible.builtin.assert:
        that:
          - >-
            (lmn_prepare_version == lmn_defaults.prepare_version and lmn_prepare_commit == lmn_defaults.prepare_commit
            and lmn_appliance_sha256 == lmn_defaults.appliance_sha256)
            or (lmn_prepare_commit != lmn_defaults.prepare_commit and lmn_appliance_sha256 != lmn_defaults.appliance_sha256)
        fail_msg: >-
          For lmn-appliance {{ lmn_prepare_version }}, please also set lmn_prepare_commit and
          lmn_appliance_sha256 (-e).
      vars:
        lmn_defaults: '{{ lmn_version_map[ansible_distribution_major_version] }}'

    - name: Show the selected linuxmuster version
      ansible.builtin.debug:
        msg: >-
          Ubuntu {{ ansible_distribution_version }} detected -> linuxmuster.net
          {{ lmn_version_label }} ({{ lmn_repo_distribution }}, suite
          {{ lmn_repo_suite }}, lmn-appliance {{ lmn_prepare_version }},
          commit {{ lmn_prepare_commit[:7] }})

    # -------------------------------------------------------------------------
    # DETECT PROXY + UPSTREAM DNS (before the network is reconfigured)
    # -------------------------------------------------------------------------
    - name: Read the system proxy from /etc/environment
      ansible.builtin.shell: |
        . /etc/environment 2>/dev/null || true
        printf '%s\n%s\n%s\n' "${http_proxy:-${HTTP_PROXY:-}}" "${https_proxy:-${HTTPS_PROXY:-}}" "${no_proxy:-${NO_PROXY:-}}"
      args:
        executable: /bin/bash
      register: lmn_proxy_raw
      changed_when: false
      failed_when: false

    - name: Set the proxy variables
      ansible.builtin.set_fact:
        lmn_http_proxy: "{{ lmn_proxy_raw.stdout_lines[0] | default('') }}"
        lmn_https_proxy: "{{ lmn_proxy_raw.stdout_lines[1] | default('') }}"
        lmn_no_proxy: "{{ lmn_proxy_raw.stdout_lines[2] | default('') }}"

    - name: Show the proxy configuration
      ansible.builtin.debug:
        msg: >-
          Proxy: http='{{ lmn_http_proxy }}' https='{{ lmn_https_proxy }}'
          no_proxy='{{ lmn_no_proxy }}'

    - name: Detect the upstream DNS of the host
      ansible.builtin.shell: |
        for f in /run/systemd/resolve/resolv.conf /etc/resolv.conf; do
          [ -r "$f" ] || continue
          ns=$(awk '/^[[:space:]]*nameserver/ {print $2}' "$f" | grep -vE '^(127\.|::1|fe80)' | head -1)
          [ -n "$ns" ] && { echo "$ns"; exit 0; }
        done
        command -v resolvectl >/dev/null 2>&1 && resolvectl dns 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | grep -vE '^127\.' | head -1
      args:
        executable: /bin/bash
      register: lmn_detected_dns
      changed_when: false
      failed_when: false

    # Its own name: an 'auto' given with -e outranks set_fact.
    - name: Determine the DNS forwarder (auto -> detected upstream, otherwise 9.9.9.9)
      ansible.builtin.set_fact:
        lmn_dns_server: >-
          {{ ((lmn_detected_dns.stdout | default('') | trim) or '9.9.9.9')
          if lmn_dns_forwarder == 'auto' else lmn_dns_forwarder }}

    - name: Show the DNS forwarder in use
      ansible.builtin.debug:
        msg: "DNS forwarder for Samba: {{ lmn_dns_server }}"

    - name: Check whether linuxmuster-setup has run
      ansible.builtin.stat:
        path: /var/lib/linuxmuster/.setup.done
      register: lmn_setup_done

    # lmn-prepare leaves the gateway as the only nameserver until Samba runs, and linuxmuster-setup's
    # ntpd -q pool.ntp.org then waits for good without DNS. Checked before anything changes, so in
    # Python: dig (dnsutils) comes with the packages installed later.
    - name: Check that the gateway answers DNS queries
      ansible.builtin.command:
        argv: [python3, -c, '{{ lmn_dns_query }}', '{{ lmn_gateway }}', pool.ntp.org]
      vars:
        # Exit code 0: resolved (or truncated, which a client completes over TCP), 2: answered without
        # an address, 1: no answer.
        lmn_dns_query: |
          import random, socket, struct, sys
          server, name = sys.argv[1], sys.argv[2]
          query = struct.pack(">HHHHHH", random.getrandbits(16), 0x0100, 1, 0, 0, 0)
          query += b"".join(bytes([len(p)]) + p.encode() for p in name.split(".")) + b"\0\0\1\0\1"
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.settimeout(3)
          for _ in range(2):
              try:
                  sock.sendto(query, (server, 53))
                  answer = sock.recv(512)
              except OSError:
                  continue
              resolved = answer[3] & 0x0F == 0 and (answer[2] & 0x02 or struct.unpack(">H", answer[6:8])[0])
              sys.exit(0 if resolved else 2)
          sys.exit(1)
      register: lmn_gateway_dns
      changed_when: false
      failed_when: false
      when: not lmn_setup_done.stat.exists

    - name: 'Stop: the gateway does not answer DNS queries'
      ansible.builtin.fail:
        msg: >-
          The gateway {{ lmn_gateway }} {{ 'does not answer DNS queries' if lmn_gateway_dns.rc == 1
          else 'does not resolve pool.ntp.org' }}. linuxmuster.net uses the gateway (its firewall) as
          the server's DNS server until the setup has set up Samba, and the setup waits for good without
          it. Let the firewall answer DNS queries, then start the installation again. linuxmuster.net
          has not been set up on the server yet.
      when: lmn_gateway_dns is not skipped and lmn_gateway_dns.rc != 0

    - name: Wait for the apt lock
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

    - name: Stop and disable unattended-upgrades
      ansible.builtin.shell: |
        systemctl stop unattended-upgrades 2>/dev/null || true
        systemctl disable unattended-upgrades 2>/dev/null || true
        killall -9 unattended-upgr 2>/dev/null || true
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          sleep 3
        done
      changed_when: true
      when: lmn_disable_auto_updates | bool
      notify: Switch automatic security updates back on

    - name: Configure the time zone
      community.general.timezone:
        name: '{{ lmn_timezone }}'

    - name: Disable cloud-init
      ansible.builtin.file:
        path: /etc/cloud/cloud-init.disabled
        state: touch
        mode: '0644'
      ignore_errors: true

    - name: Wait for the apt lock (before cloud-init)
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

    - name: Remove the cloud-init package
      ansible.builtin.apt:
        name: cloud-init
        state: absent
        purge: true
      ignore_errors: true

    - name: Remove the cloud-init directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/cloud
        - /var/lib/cloud
      ignore_errors: true

    - name: Install the required packages
      ansible.builtin.apt:
        name: '{{ lmn_additional_packages }}'
        state: present
        update_cache: true

    - name: Generate the locale
      community.general.locale_gen:
        name: '{{ lmn_locale }}'
        state: present

    - name: Set the locale as default
      ansible.builtin.command:
        argv: [localectl, set-locale, "LANG={{ lmn_locale }}"]
      changed_when: true

    # =========================================================================
    # PAUSE AUTOMATIC UPDATES DURING THE INSTALLATION
    # =========================================================================

    - name: Pause automatic updates during the installation
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: '^APT::Periodic::Unattended-Upgrade'
        line: 'APT::Periodic::Unattended-Upgrade "0";'
        create: true
        mode: '0644'
      when: lmn_disable_auto_updates | bool
      notify: Switch automatic security updates back on

    # =========================================================================
    # QEMU GUEST AGENT (for virtualisation)
    # =========================================================================

    - name: Enable the QEMU guest agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        state: started
      ignore_errors: true

    # =========================================================================
    # SERIAL CONSOLE (for Proxmox)
    # =========================================================================

    - name: Enable the serial console service
      ansible.builtin.systemd:
        name: serial-getty@ttyS0.service
        enabled: true
        state: started
      ignore_errors: true

    # =========================================================================
    # SYSTEM UPDATE
    # =========================================================================

    - name: Update the system
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

    # =========================================================================
    # LINUXMUSTER.NET REPOSITORY
    # =========================================================================

    - name: Download the GPG key
      ansible.builtin.get_url:
        url: '{{ lmn_repo_gpg_url }}'
        dest: '{{ lmn_repo_key_download }}'
        mode: '0644'
        force: true

    - name: Read the fingerprints of the edulution keys
      ansible.builtin.command:
        argv: [gpg, --batch, --show-keys, --with-colons, '{{ lmn_repo_key_download }}']
      register: lmn_repo_key_info
      changed_when: false

    - name: Check the fingerprints of the edulution keys
      ansible.builtin.assert:
        that:
          - lmn_key_primary_fprs | length > 0
          - lmn_key_primary_fprs is subset(lmn_repo_key_fprs)
          - lmn_key_lines | select('match', '^sec:') | list | length == 0
        fail_msg: >-
          {{ lmn_repo_gpg_url }} provides no key, a secret key or a key other than
          {{ lmn_repo_key_fingerprints | join(', ') }}. Installation stopped.
        quiet: true
      vars:
        lmn_key_lines: '{{ lmn_repo_key_info.stdout_lines }}'

    # pub.gpg is ASCII-armored; edulution.gpg, the file of
    # edulution-archive-keyring, is a binary keyring.
    - name: Convert and install the GPG key
      ansible.builtin.command:
        argv: [gpg, --batch, --yes, --dearmor, -o, '{{ lmn_repo_keyring }}', '{{ lmn_repo_key_download }}']

    # Fixed content instead of apt_repository: an older setup leaves lmn.list
    # without signed-by, which would otherwise stay next to the new line.
    - name: Remove the globally trusted linuxmuster.net key before adding the repository
      ansible.builtin.file:
        path: '{{ lmn_appliance_global_key }}'
        state: absent

    - name: Find an existing deb822 source before adding the repository
      ansible.builtin.stat:
        path: '{{ lmn_repo_sources }}'
      register: lmn_repo_sources_before

    - name: Add the edulution repository
      ansible.builtin.copy:
        dest: '{{ lmn_repo_list }}'
        content: "{{ lmn_repo_deb_line }}\n"
        mode: '0644'
      when: not lmn_repo_sources_before.stat.exists

    - name: Remove the duplicate edulution source before lmn-appliance
      ansible.builtin.file:
        path: '{{ lmn_repo_list }}'
        state: absent
      when: lmn_repo_sources_before.stat.exists

    - name: Update the package lists
      ansible.builtin.apt:
        update_cache: true

    # =========================================================================
    # LMN-APPLIANCE SCRIPT
    # =========================================================================

    - name: Download the lmn-appliance script
      ansible.builtin.get_url:
        url: '{{ lmn_appliance_url }}'
        dest: '{{ lmn_appliance_script }}'
        mode: '0755'
        checksum: 'sha256:{{ lmn_appliance_sha256 }}'

    # lmn-appliance gets the keys checked above as its source and keyring.
    - name: Switch lmn-appliance to the checked keys
      ansible.builtin.replace:
        path: '{{ lmn_appliance_script }}'
        regexp: '^{{ item.key }} = .*$'
        replace: '{{ item.value }}'
      loop: '{{ lmn_appliance_key_lines | dict2items }}'
      loop_control:
        label: '{{ item.value }}'

    - name: Read the lmn-appliance script
      ansible.builtin.slurp:
        src: '{{ lmn_appliance_script }}'
      register: lmn_appliance_source

    - name: Check that lmn-appliance uses the checked keys
      ansible.builtin.assert:
        that:
          - (lmn_appliance_lines | select('match', '^lmnkey_remote ') | list) == [lmn_appliance_key_lines.lmnkey_remote]
          - (lmn_appliance_lines | select('match', '^lmnkey_local ') | list) == [lmn_appliance_key_lines.lmnkey_local]
        fail_msg: >-
          lmn-appliance cannot be switched to the checked keys
          (lmnkey_remote or lmnkey_local). Installation stopped.
        quiet: true
      vars:
        lmn_appliance_lines: "{{ (lmn_appliance_source.content | b64decode).splitlines() }}"

    - name: Convert the netmask to CIDR notation
      ansible.builtin.set_fact:
        lmn_cidr: "{{ (lmn_server_ip + '/' + lmn_netmask) | ansible.utils.ipaddr('prefix') }}"

    # Its creates: file is written by nothing, so a finished server would be prepared again.
    - name: Run lmn-appliance (server profile)
      when: not lmn_setup_done.stat.exists
      ansible.builtin.shell: |
        set -o pipefail
        {{ lmn_appliance_script }} -p server -u \
          -n {{ (lmn_server_ip ~ '/' ~ lmn_cidr) | quote }} \
          -f {{ lmn_gateway | quote }} \
          -d {{ lmn_domainname | quote }} \
          -t {{ lmn_servername | quote }} \
          2>&1 | while IFS= read -r line; do
          echo "$line"
        done
      args:
        executable: /bin/bash
        creates: /etc/linuxmuster/.appliance_configured
      register: lmn_appliance_result
      changed_when: lmn_appliance_result.rc == 0
      async: 1800
      poll: 30

    # =========================================================================
    # REPOSITORY KEY AFTER LMN-APPLIANCE
    # =========================================================================
    # Follow-up check: lmn-appliance, and edulution-archive-keyring which it
    # installs, may leave only the accepted keys behind, and the repository
    # uses them through signed-by only.

    - name: Check the repository key after lmn-appliance
      block:
        - name: Find the keys written by lmn-appliance
          ansible.builtin.stat:
            path: '{{ item }}'
          loop:
            - '{{ lmn_repo_keyring }}'
            - '{{ lmn_appliance_global_key }}'
          register: lmn_written_keys

        - name: Repository key present after lmn-appliance
          ansible.builtin.assert:
            that: lmn_written_keys.results[0].stat.exists
            fail_msg: '{{ lmn_repo_keyring }} is missing after lmn-appliance.'
            quiet: true

        - name: Read the fingerprints of the keys written by lmn-appliance
          ansible.builtin.command:
            argv: [gpg, --batch, --show-keys, --with-colons, '{{ item.stat.path }}']
          loop: "{{ lmn_written_keys.results | selectattr('stat.exists') | list }}"
          loop_control:
            label: '{{ item.stat.path }}'
          register: lmn_written_key_info
          changed_when: false

        - name: Check the fingerprints of the keys written by lmn-appliance
          ansible.builtin.assert:
            that:
              - lmn_key_primary_fprs | length > 0
              - lmn_key_primary_fprs is subset(lmn_repo_key_fprs)
              - lmn_key_lines | select('match', '^sec:') | list | length == 0
            fail_msg: >-
              {{ item.item.stat.path }} contains no key, a secret key or a key other than
              {{ lmn_repo_key_fingerprints | join(', ') }}. Installation stopped.
            quiet: true
          vars:
            lmn_key_lines: '{{ item.stdout_lines }}'
          loop: '{{ lmn_written_key_info.results }}'
          loop_control:
            label: '{{ item.item.stat.path }}'
      rescue:
        - name: Remove the unexpected linuxmuster key and its package sources
          ansible.builtin.file:
            path: '{{ item }}'
            state: absent
          loop:
            - '{{ lmn_repo_keyring }}'
            - '{{ lmn_appliance_global_key }}'
            - '{{ lmn_repo_list }}'
            - '{{ lmn_repo_sources }}'

        - name: 'Stop: unexpected linuxmuster key'
          ansible.builtin.fail:
            msg: >-
              After lmn-appliance the linuxmuster key is missing or a different one is present;
              the key and the package source were removed. Expected: {{ lmn_repo_key_fingerprints | join(', ') }}

    - name: Remove the globally trusted linuxmuster.net key
      ansible.builtin.file:
        path: '{{ lmn_appliance_global_key }}'
        state: absent

    - name: Find the deb822 source written by lmn-appliance
      ansible.builtin.stat:
        path: '{{ lmn_repo_sources }}'
      register: lmn_repo_sources_file

    - name: Restrict the edulution repository to its key
      ansible.builtin.copy:
        dest: '{{ lmn_repo_list }}'
        content: "{{ lmn_repo_deb_line }}\n"
        mode: '0644'
      when: not lmn_repo_sources_file.stat.exists

    - name: Remove the duplicate edulution source
      ansible.builtin.file:
        path: '{{ lmn_repo_list }}'
        state: absent
      when: lmn_repo_sources_file.stat.exists

    # =========================================================================
    # MAKE SURE THE LINUXMUSTER SERVER PACKAGES ARE INSTALLED
    # =========================================================================
    # lmn-appliance/lmn-prepare installs the server packages itself, but does not
    # check the return code and may run without DEBIAN_FRONTEND -> packages with
    # debconf questions make the install stop silently in a non-interactive run,
    # so /usr/sbin/linuxmuster-setup is missing. Therefore install them here
    # explicitly and non-interactively (idempotent, clear error message).

    - name: Finish half-configured packages
      ansible.builtin.command:
        cmd: dpkg --configure -a
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: false

    # Kept in step with srvpkgs in lmn-prepare. linuxmuster-webui7 is not part
    # of this installation; linuxmuster-api7 takes its place, and
    # edulution-linbo-gui7 replaces linuxmuster-linbo-gui7 (it declares
    # Provides/Conflicts/Replaces for it).
    - name: Install the linuxmuster server packages (non-interactive)
      ansible.builtin.apt:
        name:
          - linuxmuster-base7
          - linuxmuster-linbo7
          - linuxmuster-tools7
          - linuxmuster-cli7
          - linuxmuster-api7
          - edulution-linbo-gui7
          - sophomorix-samba
        state: latest
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Make sure linuxmuster-setup is present
      ansible.builtin.stat:
        path: /usr/sbin/linuxmuster-setup
      register: lmn_setup_bin

    - name: Stop if linuxmuster-setup is missing
      ansible.builtin.assert:
        that: lmn_setup_bin.stat.exists
        fail_msg: >-
          /usr/sbin/linuxmuster-setup is missing - the linuxmuster server packages
          could not be installed. Please check 'apt-get install
          linuxmuster-base7' (repository/dependencies).


    # =========================================================================
    # LINUXMUSTER-SETUP CONFIGURATION FILE
    # =========================================================================

    - name: Create the setup configuration directory
      ansible.builtin.file:
        path: /root/.linuxmuster
        state: directory
        mode: '0700'

    # NOTE: lmn_adminpw must not contain the characters $ and %.
    # linuxmuster-setup reads the ini with Python's ConfigParser, whose
    # interpolation evaluates $... and %(...)s sequences and would otherwise
    # damage the password. The web UI already validates this; when calling
    # ansible-playbook directly, the caller has to make sure of it.
    - name: Create the setup configuration file
      ansible.builtin.copy:
        content: |
          [setup]
          serverip = {{ lmn_server_ip }}
          netmask = {{ lmn_netmask }}
          bitmask = {{ lmn_cidr }}
          gatewayip = {{ lmn_gateway }}
          firewallip = {{ lmn_gateway }}
          servername = {{ lmn_servername }}
          domainname = {{ lmn_domainname }}
          dhcprange = {{ lmn_dhcprange }}
          schoolname = {{ lmn_schoolname }}
          location = {{ lmn_location }}
          country = {{ lmn_country }}
          state = {{ lmn_state }}
          adminpw = {{ lmn_adminpw }}
          skipfw = {{ lmn_skip_firewall | ternary('True', 'False') }}
        dest: /root/.linuxmuster/setup.ini
        mode: '0600'
      no_log: true

    # =========================================================================
    # RUN LINUXMUSTER-SETUP
    # =========================================================================

    - name: Run linuxmuster-setup
      ansible.builtin.shell: |
        set -o pipefail
        /usr/sbin/linuxmuster-setup \
          --config=/root/.linuxmuster/setup.ini \
          {% if lmn_unattended %}--unattended{% endif %} \
          {% if lmn_skip_firewall %}--skip-fw{% endif %} \
          2>&1 | while IFS= read -r line; do
          echo "$line"
        done
      args:
        executable: /bin/bash
        creates: /var/lib/linuxmuster/.setup.done
      # No changed_when on rc: a run skipped by creates also returns rc 0, but only a real run is changed.
      register: lmn_setup_result
      async: 3600
      poll: 30

    # =========================================================================
    # POST-SETUP TASKS
    # =========================================================================

    - name: Protect the setup log files
      ansible.builtin.file:
        path: '{{ item }}'
        mode: '0600'
      loop:
        - /var/log/linuxmuster/setup.log
      ignore_errors: true

    - name: Create the marker file for a successful installation
      ansible.builtin.file:
        path: /var/lib/linuxmuster/.setup.done
        state: touch
        mode: '0644'
      when: lmn_setup_result is defined and lmn_setup_result.rc == 0

    # linuxmuster-setup puts "dns forwarder = <firewallip>" into smb.conf.
    # Without a firewall that is a dead resolver -> external DNS names
    # (deb.linuxmuster.net, archive.ubuntu.com, ...) no longer resolve.
    # Point it to a working forwarder before Samba restarts so that the
    # following apt tasks do not fail.
    # Only right after the setup or when given: on a finished server 'auto' finds the server itself.
    - name: Set the DNS forwarder in smb.conf to a working resolver
      ansible.builtin.replace:
        path: /etc/samba/smb.conf
        regexp: '^(\s*dns forwarder\s*=\s*).*$'
        replace: '\g<1>{{ lmn_dns_server }}'
      when: lmn_setup_result is changed or lmn_dns_forwarder != 'auto'

    - name: Restart Samba AD DC
      ansible.builtin.systemd:
        name: samba-ad-dc
        state: restarted
        enabled: true

    - name: Wait until Samba LDAP is ready
      ansible.builtin.shell: |
        for i in $(seq 1 30); do
          if samba-tool user show Administrator >/dev/null 2>&1; then
            echo "Samba LDAP ready after $i attempts"
            exit 0
          fi
          sleep 5
        done
        echo "Samba LDAP not reachable after 150 seconds"
        exit 1
      changed_when: false

    - name: Check external DNS resolution (not critical)
      ansible.builtin.command:
        cmd: getent hosts deb.linuxmuster.net
      register: lmn_dns_check
      until: lmn_dns_check.rc == 0
      retries: 6
      delay: 5
      changed_when: false
      failed_when: false

    - name: Note when external DNS resolution does not work
      ansible.builtin.debug:
        msg: >-
          External name resolution (deb.linuxmuster.net) through the DNS forwarder
          {{ lmn_dns_server }} does not work. Behind a proxy this is often
          normal (apt goes through the proxy). If apt tasks fail afterwards,
          please check lmn_dns_forwarder.
      when: lmn_dns_check.rc != 0

    # =========================================================================
    # CREATE THE EDULUTION BIND USER (via sophomorix)
    # =========================================================================

    - name: Compute the domain components
      ansible.builtin.set_fact:
        edulution_dc_parts: "{{ lmn_domainname.split('.') | map('regex_replace', '^(.*)$', 'DC=\\1') | join(',') }}"

    - name: Check whether edulutionui-binduser already exists
      ansible.builtin.command:
        cmd: samba-tool user show edulutionui-binduser
      register: binduser_exists
      failed_when: false
      changed_when: false

    # After the samba-ad-dc restart, samba-tool (local DB) already answers
    # while the network LDAP that sophomorix uses is not ready yet
    # ("No connection to Samba4 AD!"). So repeat the call with a short delay
    # until the connection works (nothing is created before that).
    - name: Create edulutionui-binduser with sophomorix
      ansible.builtin.command:
        cmd: >
          sophomorix-admin
          --create-global-binduser edulutionui-binduser
          --random-passwd-save
      register: binduser_create_result
      # sophomorix-admin prints the generated password.
      no_log: true
      when: binduser_exists.rc != 0
      until: binduser_create_result.rc == 0
      retries: 12
      delay: 5

    - name: Debug - bind user creation result
      ansible.builtin.debug:
        msg: |
          rc: {{ binduser_create_result.rc | default('skipped') }}

    - name: Read the bind user password from the linuxmuster secret
      ansible.builtin.command:
        cmd: cat /etc/linuxmuster/.secret/edulutionui-binduser
      register: binduser_pw_result
      changed_when: false
      no_log: true

    # Keycloak connects over LDAPS and verifies the server certificate against this CA.
    - name: Read the linuxmuster CA certificate
      ansible.builtin.slurp:
        src: /etc/linuxmuster/ssl/cacert.pem
      register: lmn_ca_certificate

    - name: Create the edulution configuration directory
      ansible.builtin.file:
        path: /var/lib/edulution
        state: directory
        mode: '0700'

    - name: Write the edulution bind user configuration
      ansible.builtin.copy:
        # One expression: a password assigned as its own template would become a list or bool under ansible-core 2.16.
        content: |
          {{ {
            'binduser_dn': 'CN=edulutionui-binduser,OU=Management,OU=GLOBAL,' ~ edulution_dc_parts,
            'binduser_password': binduser_pw_result.stdout | trim,
            'ca_certificate': lmn_ca_certificate.content | b64decode,
          } | to_nice_json }}
        dest: /var/lib/edulution/binduser-config.json
        mode: '0600'
      no_log: true

    # =========================================================================
    # INSTALL LINUXMUSTER-API
    # =========================================================================

    - name: Wait for the apt lock (post-setup)
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

    - name: Install linuxmuster-api7
      ansible.builtin.apt:
        name: linuxmuster-api7
        state: present
        update_cache: true

    - name: Create the systemd override directory for linuxmuster-api
      ansible.builtin.file:
        path: /etc/systemd/system/linuxmuster-api.service.d
        state: directory
        mode: '0755'

    - name: Create the systemd override for linuxmuster-api (Samba dependency)
      ansible.builtin.copy:
        content: |
          [Unit]
          After=samba-ad-dc.service
          Requires=samba-ad-dc.service

          [Service]
          Restart=on-failure
          RestartSec=10
        dest: /etc/systemd/system/linuxmuster-api.service.d/override.conf
        mode: '0644'

    - name: Reload the systemd configuration
      ansible.builtin.systemd:
        daemon_reload: true

    # =========================================================================
    # INSTALL EDULUTION-FILEPROXY (WebDAV)
    # =========================================================================
    # The linuxmuster packages from package.edulution.io have no web UI and so
    # no WebDAV. edulution-fileproxy, from the same repository, serves /webdav/.
    # Everything is checked before a web UI from an earlier installation gives
    # up its port, and that web UI is restored if the fileproxy does not answer.

    - name: Gather the installed services (web UI from an earlier installation)
      ansible.builtin.service_facts:

    - name: Remember the state of the linuxmuster web UI and of edulution-fileproxy
      ansible.builtin.set_fact:
        lmn_webui_service: "{{ ansible_facts.services['linuxmuster-webui.service'] | default({}) }}"
        lmn_fileproxy_was_running: "{{ (ansible_facts.services['edulution-fileproxy.service'] | default({})).state | default('') == 'running' }}"

    # The package installs the service neither enabled nor started.
    - name: Install edulution-fileproxy
      ansible.builtin.apt:
        name: edulution-fileproxy
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Read the Samba NetBIOS domain
      ansible.builtin.command:
        argv: [testparm, -s, --parameter-name=workgroup]
      register: lmn_samba_workgroup
      changed_when: false

    - name: Check the Samba NetBIOS domain
      ansible.builtin.assert:
        that: lmn_samba_workgroup.stdout | trim is match('^[A-Za-z0-9-]{1,15}$')
        fail_msg: "testparm returned no usable NetBIOS domain: '{{ lmn_samba_workgroup.stdout | trim }}'"
        quiet: true

    # The service account cannot read /etc/linuxmuster/ssl, so it gets its own
    # copy. It stays root's, as the login test below trusts it.
    - name: Give edulution-fileproxy the linuxmuster CA
      ansible.builtin.copy:
        src: /etc/linuxmuster/ssl/cacert.pem
        remote_src: true
        dest: '{{ lmn_fileproxy_ca }}'
        owner: root
        group: root
        mode: '0644'
      register: lmn_fileproxy_ca_file

    # The wiki indexer needs an Elasticsearch sidecar in Docker, which this
    # installation does not set up, so it is switched off. base_dn is upper
    # case as the package's own upgrade writes it.
    - name: Render the installer's edulution-fileproxy configuration
      ansible.builtin.set_fact:
        lmn_fileproxy_config: |
          ldap:
            server: "ldaps://{{ lmn_fileproxy_ldap_host }}:636"
            insecure_skip_verify: false
            root_ca_file: "{{ lmn_fileproxy_ca }}"
            base_dn: "{{ edulution_dc_parts | upper }}"
          smb:
            server: "{{ lmn_server_ip }}"
            domain: "{{ lmn_samba_workgroup.stdout | trim | upper }}"
            share_autodiscover: false
            message_signing: "require"
            shares:
              - name: default-school
              - name: linuxmuster-global
          http:
            address: ":{{ lmn_fileproxy_port }}"
            webdav_prefix: "/webdav/"
            cert_file: "/etc/edulution-fileproxy/webdav.pem"
            key_file: "/etc/edulution-fileproxy/webdav.key"
          log:
            level: "info"
            file: "/var/log/edulution-fileproxy/webdav-server.log"
          elasticsearch:
            enabled: false

    # A configuration made on this host may hold passwords.
    - name: Read the edulution-fileproxy configuration and its package default
      ansible.builtin.slurp:
        src: '{{ item }}'
      loop:
        - /etc/edulution-fileproxy/config.yml
        - /etc/edulution-fileproxy/config.example.yml
      register: lmn_fileproxy_configs
      no_log: true

    # The package's postinst copies the example and only sets base_dn in it.
    # Any other content was configured on this host and stays; WebDAV is then
    # checked on the port it sets.
    - name: Decide how to handle the edulution-fileproxy configuration
      ansible.builtin.set_fact:
        lmn_fileproxy_write_config: '{{ lmn_fileproxy_replace | bool }}'
        lmn_fileproxy_config_is_ours: >-
          {{ (lmn_fileproxy_replace | bool) or (lmn_fileproxy_current | trim) == (lmn_fileproxy_config | trim) }}
        lmn_fileproxy_listen_port: >-
          {{ lmn_fileproxy_port if (lmn_fileproxy_replace | bool)
             else ((lmn_fileproxy_current | from_yaml).http.address | default(':' ~ lmn_fileproxy_port)
                   | regex_replace('^.*:', '')) }}
      vars:
        lmn_fileproxy_current: "{{ lmn_fileproxy_configs.results[0].content | b64decode }}"
        lmn_fileproxy_replace: >-
          {{ (lmn_fileproxy_rewrite_config | bool)
             or (lmn_fileproxy_configs.results | map(attribute='content') | map('b64decode')
                 | map('regex_replace', '(?m)^[ \t]*base_dn:.*$', '') | unique | length == 1) }}
      no_log: true

    - name: Write the edulution-fileproxy configuration
      ansible.builtin.copy:
        dest: /etc/edulution-fileproxy/config.yml
        owner: edulution-fileproxy
        group: edulution-fileproxy
        mode: '0600'
        content: '{{ lmn_fileproxy_config }}'
      register: lmn_fileproxy_config_file
      when: lmn_fileproxy_write_config | bool

    - name: Note the kept edulution-fileproxy configuration
      ansible.builtin.debug:
        msg: >-
          /etc/edulution-fileproxy/config.yml was changed on this host and is kept. It is tested
          without a login, and WebDAV is checked on its port {{ lmn_fileproxy_listen_port }}.
          -e lmn_fileproxy_rewrite_config=true replaces it with the installer's configuration.
      when: not (lmn_fileproxy_config_is_ours | bool)

    # As the service user, with the bind user: the same TLS verification, bind
    # and SMB login a WebDAV login goes through. The /webdav/ probe further down
    # gets its 401 before any of that. The bind user's password goes only to the
    # servers of the installer's own configuration. The SMB part of the test has
    # no deadline of its own after connecting, hence timeout.
    - name: Test edulution-fileproxy against LDAPS and SMB
      ansible.builtin.command:
        argv: >-
          {{ ['runuser', '-u', 'edulution-fileproxy', '--', 'timeout', '-k', '10', '120',
              'edulution-fileproxy', '-c', '/etc/edulution-fileproxy/config.yml', '-t']
             + (['-user', 'edulutionui-binduser'] if (lmn_fileproxy_config_is_ours | bool) else []) }}
        stdin: "{{ (binduser_pw_result.stdout | trim) if (lmn_fileproxy_config_is_ours | bool) else omit }}"
      register: lmn_fileproxy_test
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check the edulution-fileproxy test
      ansible.builtin.assert:
        that: lmn_fileproxy_test.rc == 0
        fail_msg: >-
          {% if lmn_fileproxy_test.rc in [124, 137] %}
          edulution-fileproxy -t did not finish within 120 seconds: the LDAP or SMB server accepts
          the connection but does not answer.
          {% else %}
          edulution-fileproxy -t{{ ' -user edulutionui-binduser' if (lmn_fileproxy_config_is_ours | bool) else '' }} failed:
          {{ lmn_fileproxy_test.stdout_lines | select('search', '❌') | join(' / ') or lmn_fileproxy_test.stderr }}.
          A certificate without the server name in its subject alternative names is renewed with
          'linuxmuster-renew-certs -c server' and 'systemctl restart samba-ad-dc'.
          {% endif %}
        quiet: true

    - name: Hand the WebDAV port to edulution-fileproxy
      block:
        - name: Stop the linuxmuster web UI from an earlier installation
          ansible.builtin.systemd:
            name: linuxmuster-webui
            state: stopped
            enabled: false
          when: lmn_webui_service | length > 0

        - name: Start edulution-fileproxy
          ansible.builtin.systemd:
            name: edulution-fileproxy
            enabled: true
            state: "{{ 'restarted' if (lmn_fileproxy_ca_file is changed or lmn_fileproxy_config_file is changed) else 'started' }}"

        # 401 without credentials: the listener runs and /webdav/ asks for the login.
        - name: Wait until edulution-fileproxy answers on /webdav/
          ansible.builtin.uri:
            url: 'https://127.0.0.1:{{ lmn_fileproxy_listen_port }}/webdav/'
            validate_certs: false
            use_proxy: false
            status_code: 401
          register: lmn_fileproxy_probe
          until: lmn_fileproxy_probe.status == 401
          retries: 12
          delay: 5

        # Another HTTPS service on the port may answer 401 as well, and the unit
        # counts as started before the fileproxy has bound its port.
        - name: Check that edulution-fileproxy holds the port
          ansible.builtin.command:
            argv:
              - bash
              - -c
              - 'pid=$(systemctl show -p MainPID --value edulution-fileproxy) && [ "$pid" -gt 0 ] && ss -Hltnp "sport = :$1" | grep -q "pid=$pid,"'
              - check-listener
              - '{{ lmn_fileproxy_listen_port }}'
          register: lmn_fileproxy_listener
          changed_when: false
          until: lmn_fileproxy_listener.rc == 0
          retries: 3
          delay: 2
      rescue:
        # A fileproxy that already served WebDAV before this run stays; only a
        # first cutover hands the port back to the web UI.
        - name: Decide whether to restore the earlier web UI
          ansible.builtin.set_fact:
            lmn_fileproxy_restore_webui: "{{ lmn_webui_service | length > 0 and not (lmn_fileproxy_was_running | bool) }}"

        - name: Stop edulution-fileproxy for the earlier web UI
          ansible.builtin.systemd:
            name: edulution-fileproxy
            state: stopped
            enabled: false
          when: lmn_fileproxy_restore_webui | bool

        - name: Restore the linuxmuster web UI
          ansible.builtin.systemd:
            name: linuxmuster-webui
            state: "{{ 'started' if lmn_webui_service.state == 'running' else 'stopped' }}"
            enabled: "{{ lmn_webui_service.status == 'enabled' }}"
          when: lmn_fileproxy_restore_webui | bool

        - name: 'Stop: edulution-fileproxy does not answer'
          ansible.builtin.fail:
            msg: >-
              edulution-fileproxy does not answer on https://127.0.0.1:{{ lmn_fileproxy_listen_port }}/webdav/
              or another service holds that port.
              {{ 'The linuxmuster web UI was restored. ' if (lmn_fileproxy_restore_webui | bool) else '' }}See
              'journalctl -u edulution-fileproxy' and /var/log/edulution-fileproxy/webdav-server.log.

    # =========================================================================
    # REBOOT REPLACEMENT: targeted service restarts instead of a full reboot
    # =========================================================================
    # linuxmuster.net recommends a reboot after the setup. Where that is not
    # possible, we replace it as far as it makes sense:
    #  - needrestart restarts services with outdated libraries (apt upgrade)
    #  - the LMN stack is restarted so that it reads the new configuration --
    #    deliberately WITHOUT the network (netplan/IP change), so the current
    #    connection is not cut.
    #  - If a kernel update remains, a real reboot is still needed; this is
    #    reported at the end.

    - name: Install needrestart (if missing)
      ansible.builtin.apt:
        name: needrestart
        state: present
      failed_when: false

    - name: Restart services with outdated libraries automatically
      ansible.builtin.command:
        cmd: needrestart -r a -b
      register: needrestart_auto
      changed_when: false
      failed_when: false

    - name: Gather the installed services
      ansible.builtin.service_facts:

    - name: Restart the LMN stack (reboot replacement, without the network)
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: restarted
      loop:
        - isc-dhcp-server
        - ntpsec
        - apparmor
        - linuxmuster-api
      when: (item ~ '.service') in ansible_facts.services
      failed_when: false

    - name: Check whether a kernel reboot is needed
      ansible.builtin.command:
        cmd: needrestart -k -b
      register: needrestart_kernel
      changed_when: false
      failed_when: false

    - name: Remember the kernel reboot status
      ansible.builtin.set_fact:
        lmn_kernel_reboot_required: "{{ 'NEEDRESTART-KSTA: 3' in (needrestart_kernel.stdout | default('')) }}"

    # linuxmuster-setup replaces the SSH host keys (ssh-keygen -A), so SSH
    # clients that knew the server warn on their next login.
    - name: Read the SSH host key fingerprints
      ansible.builtin.shell: for key in /etc/ssh/ssh_host_*_key.pub; do ssh-keygen -lf "$key"; done
      register: lmn_ssh_fingerprints
      changed_when: false
      failed_when: false
      when: lmn_setup_result is changed

    # =========================================================================
    # FINAL MESSAGE
    # =========================================================================

    - name: Installation finished
      vars:
        lmn_webdav_port_suffix: "{{ '' if lmn_fileproxy_listen_port | int == 443 else ':' ~ lmn_fileproxy_listen_port }}"
      ansible.builtin.debug:
        msg: |
          ====================================================================
          LINUXMUSTER.NET {{ lmn_version_label }} INSTALLATION FINISHED
          ====================================================================

          Server: {{ lmn_servername }}.{{ lmn_domainname }}
          IP:     {{ lmn_server_ip }}

          API:    https://{{ lmn_server_ip }}:8001
          WebDAV: https://{{ lmn_server_ip }}{{ lmn_webdav_port_suffix }}/webdav/ (edulution-fileproxy)
          Login:  global-admin (password from the setup)

          The linuxmuster web UI (Ajenti) is not installed - user and device
          management runs through the edulution UI and lmncli.

          edulution bind user: CN=edulutionui-binduser,OU=Management,OU=GLOBAL,{{ edulution_dc_parts }}

          Services were restarted selectively instead of a reboot (without the network).
          {% if lmn_local_install | bool %}
          The edulution installation continues on this server. Its installer script says at the end when to reboot.
          {% else %}
          {{ 'WARNING: The kernel was updated - reboot the server!'
             if (lmn_kernel_reboot_required | default(false) | bool)
             else 'No kernel update. Reboot the server so that the network configuration takes effect.' }}
          {% endif %}

          ====================================================================

    # A list keeps the entries readable; a multi-line string shows as escaped \n in the log.
    - name: New SSH host keys
      ansible.builtin.debug:
        msg: >-
          {{ ['linuxmuster-setup created new SSH host keys. SSH clients that knew this server warn once (REMOTE HOST IDENTIFICATION HAS CHANGED).',
              'Compare a fingerprint, then remove the old entry with: ssh-keygen -R <server name or IP>']
             + lmn_ssh_fingerprints.stdout_lines }}
      when: lmn_setup_result is changed

  # ===========================================================================
  # HANDLERS
  # ===========================================================================

  handlers:
    # Ubuntu's 50unattended-upgrades only allows Ubuntu's own release and security sources; linuxmuster packages stay manual.
    - name: Switch on automatic security updates in 20auto-upgrades
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: '^APT::Periodic::Unattended-Upgrade'
        line: 'APT::Periodic::Unattended-Upgrade "1";'
        create: true
        mode: '0644'
      listen: Switch automatic security updates back on

    - name: Start unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: true
        state: started
      listen: Switch automatic security updates back on

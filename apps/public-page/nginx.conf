server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bootstrap-Script (get.edulution.io/installer) als Text ausliefern, damit es
    # im Browser lesbar ist; `curl | bash` funktioniert unabhaengig vom Typ.
    location = /installer {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Konfigurationsvorlagen (get.edulution.io/download/*.template)
    location /download/ {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Single-Page-App: vorhandene Dateien direkt, sonst index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

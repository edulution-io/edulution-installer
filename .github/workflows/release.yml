name: Release

# Publishing a release builds and signs the installer image. Only the newest final release moves
# :latest and deploys get.edulution.io; a pre-release is installed with `installer --version`.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/edulution-io/edulution-installer

jobs:
  # A release drafted by prepare-release.yml carries the SBOMs and is marked pre-release exactly
  # when its tag has a suffix; anything else must not reach :latest or get.edulution.io.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          then
            echo "::error::$TAG is not a release tag (vX.Y.Z, or vX.Y.Z-suffix for a pre-release)"
            exit 1
          fi

          expected=false
          if [[ $TAG == *-* ]]
          then
            expected=true
          fi
          if [[ $PRERELEASE != "$expected" ]]
          then
            echo "::error::$TAG is published with pre-release=$PRERELEASE, but its tag means pre-release=$expected"
            exit 1
          fi

          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for component in edulution-installer edulution-installer-api edulution-lmninstaller
          do
            if ! grep -qxF "$component-$TAG.cdx.json" <<< "$assets"
            then
              echo "::error::$TAG lacks $component-$TAG.cdx.json; draft releases with prepare-release.yml by pushing the tag"
              exit 1
            fi
          done

  # Separate from the push job so dependency install and build code never hold packages: write.
  webinstaller:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # A release job reads no cache that another run could have written.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the web installer
        run: npx nx build webinstaller

      - name: Upload the web installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webinstaller
          path: dist/apps/webinstaller
          if-no-files-found: error

  build:
    needs: webinstaller
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the web installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webinstaller
          path: dist/apps/webinstaller

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the immutable version tag; the promote job moves :latest and :X.Y.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALLER_REF=${{ github.ref_name }}
          platforms: linux/amd64
          sbom: true
          provenance: mode=max

  # Separate from the build job so the OIDC token that signs never reaches dependency install or build code.
  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
      id-token: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          then
            echo "::error::The build returned no sha256 digest"
            exit 1
          fi
          cosign sign --yes "$IMAGE@$DIGEST"

  # Serialized and checked against the published releases, so a release that finishes later
  # never moves the tags back to an older version.
  promote:
    if: ${{ !github.event.release.prerelease }}
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write

    concurrency:
      group: release-promote
      cancel-in-progress: false

    outputs:
      newest: ${{ steps.promote.outputs.newest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest and the minor version tag
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          then
            echo "::error::The build returned no sha256 digest"
            exit 1
          fi

          releases=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')
          minor=${TAG%.*}
          tags=()
          newest=false
          if [[ $(.github/scripts/newest-release.sh <<< "$releases") == "$TAG" ]]
          then
            tags+=("$IMAGE:latest")
            newest=true
          fi
          if [[ $(.github/scripts/newest-release.sh "$minor" <<< "$releases") == "$TAG" ]]
          then
            tags+=("$IMAGE:${minor#v}")
          fi
          echo "newest=$newest" >> "$GITHUB_OUTPUT"

          if (( ${#tags[@]} == 0 ))
          then
            echo "A newer release of ${minor#v} is published; $TAG moves no tags." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for tag in "${tags[@]}"
          do
            docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
            # The signature and attestations belong to the digest, so the tag must point at it unchanged.
            moved=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [[ $moved != "$DIGEST" ]]
            then
              echo "::error::$tag points at $moved instead of $DIGEST"
              exit 1
            fi
            echo "Moved $tag to $DIGEST." >> "$GITHUB_STEP_SUMMARY"
          done

  # After promote, so get.edulution.io never points at an image without a signature or an older release.
  pages-build:
    if: ${{ needs.promote.outputs.newest == 'true' }}
    needs: [build, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the public page
        run: npm run build:public

      - name: Stamp the released image into the installer
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          REF: ${{ github.ref_name }}
        run: .github/scripts/stamp-installer.sh dist/apps/public-page/installer "$IMAGE@$DIGEST" "$REF"

      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/apps/public-page

  # Separate from pages-build so the deployment token never reaches dependency install or build code.
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked again here: a newer release may have been published while this one was building.
      - name: Check that this is still the newest release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          newest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName' \
            | .github/scripts/newest-release.sh)
          if [[ $newest == "$TAG" ]]
          then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "$newest is published, so get.edulution.io stays on it." >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.newest.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.newest.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

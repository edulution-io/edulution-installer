services:
  edulution-installer-dev:
    container_name: edulution-installer-dev
    build:
      context: .
    volumes:
      - ./data:/edulution-ui
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 443:8000
    entrypoint: /startup.sh
    environment:
      # EDULUTION_DIRECTORY wird nicht mehr gesetzt: der Installer verwendet den
      # festen Container-Pfad /edulution-ui (siehe ./data:/edulution-ui Mount).
      - BOOTSTRAP_BRANCH=${BOOTSTRAP_BRANCH:-main}
